      {
        "@context": "https://schema.org",

            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web Browser",
            "description": "Browser media player for video and audio files including MP4, WebM, YouTube links, MP3, WAV, OGG, M4A, MIDI, and SMAF .mmf ringtones.",
            "url": "https://joeheyming.github.io/media-player/",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What file formats does Media Player support?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Whatever your browser supports natively — typically MP4, WebM, MOV (H.264), MKV (limited), MP3, WAV, OGG, M4A, FLAC — plus MIDI (.mid) and Yamaha SMAF ringtones (.mmf), which are synthesized in the browser. Drag-and-drop a file or pick from disk."
                }
              },
              {
                "@type": "Question",
                "name": "Are my files uploaded?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Files stay on your device. Regular audio/video uses object URLs; MIDI and MMF are decoded locally and played through the Web Audio API. Nothing is uploaded; no server is involved."
                }
              },
              {
                "@type": "Question",
                "name": "Can it play MIDI or old phone MMF ringtones?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Drop a .mid / .midi file and it plays through a General MIDI synth in the browser. Yamaha SMAF .mmf ringtones are converted locally from their score track and played the same way. Use the timeline slider or skip buttons to seek. Playback speed is not available for MIDI/MMF."
                }
              },
              {
                "@type": "Question",
                "name": "Can I cast to my TV?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "AirPlay (Safari) and Chromecast (Chrome on Android) icons appear automatically in the standard browser video controls. Local files cast successfully on most modern TVs."
                }
              },
              {
                "@type": "Question",
                "name": "Does it remember my play position?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Per-file resume position is stored in localStorage keyed by file name and size, so reopening the same file picks up where you left off."
                }
              }
            ]
          },

  <body>
    <div id="player-container">
      <!-- Toolbar -->
      <div id="toolbar">
        <div class="toolbar-group">
          <button id="btn-open" title="Open File (Ctrl+O)">
            📂
            <span class="btn-label">Open</span>
          </button>
          <button id="btn-close" title="Close Media" disabled>
            ✖️
            <span class="btn-label">Close</span>
          </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-skip-back" title="Skip Back 10s (←)" disabled>⏪</button>
          <button id="btn-play-pause" title="Play/Pause (Space)" disabled>▶️</button>
          <button id="btn-skip-forward" title="Skip Forward 10s (→)" disabled>⏩</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-loop" title="Loop (L)" disabled>🔁</button>
          <select id="playback-speed" title="Playback Speed" aria-label="Playback speed" disabled>
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-pip" title="Picture-in-Picture (P)" disabled>📺</button>
          <button id="btn-fullscreen" title="Fullscreen (F)" disabled>⛶</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
          <span id="time-display">--:-- / --:--</span>
        </div>
      </div>

      <!-- Drop Zone -->
      <div id="drop-zone" class="active">
        <div class="drop-content">
          <span class="icon">🎵</span>
          <h1>Media Player</h1>
          <p>
            Drop a media file here or click
            <strong>Open</strong>
          </p>
          <p class="formats">
            Video: MP4, WebM, YouTube &nbsp;|&nbsp; Audio: MP3, WAV, OGG, M4A, MIDI, MMF
          </p>
        </div>
      </div>

      <!-- Media Area -->
      <div id="media-wrapper" class="hidden">
        <!-- Video element (also used for audio) -->
        <video id="media" controls>Your browser does not support the media tag.</video>

        <!-- YouTube embed (shown when playing YouTube links) -->
        <div id="youtube-container" class="hidden">
          <iframe
            id="youtube-player"
            width="100%"
            height="100%"
            frameborder="0"
            credentialless
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>

        <!-- Audio visualization (shown when playing audio) -->
        <div id="audio-visual" class="hidden">
          <div class="album-art">🎵</div>
          <div class="audio-info">
            <div id="audio-title">Unknown Track</div>
            <div id="audio-artist">Unknown Artist</div>
          </div>
          <div class="visualizer">
            <canvas id="viz-canvas"></canvas>
          </div>
          <div class="midi-seek-row" id="midi-seek-row">
            <input
              type="range"
              id="midi-seek"
              min="0"
              max="1000"
              value="0"
              step="1"
              disabled
              aria-label="Seek"
            />
          </div>
          <div class="midi-channels" id="midi-channels">
            <div class="midi-channels-label">Channels</div>
            <div id="midi-channel-list"></div>
          </div>
        </div>

        <div id="media-info">
          <span id="media-name"></span>
        </div>
      </div>
    </div>

    <!-- Hidden file input for opening files -->
    <input
      type="file"
      id="file-input"
      accept="video/*,audio/*,.mid,.midi,.kar,.mmf,audio/midi,application/vnd.smaf"
      style="display: none"
      aria-label="Open media file"
    />

    <script src="https://cdn.jsdelivr.net/npm/webaudio-tinysynth@1.1.3/webaudio-tinysynth.min.js"></script>
    <script src="id3-parser.js"></script>
    <script type="module" src="media-player.js"></script>
  </body>
