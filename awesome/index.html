    <div
      class="awesome-top-ui"
      style="
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;

    >
      <div
        id="awesome-timer"
        style="
          display: none;
          background: rgba(0, 0, 0, 0.7);
          color: #fff;
          padding: 8px 16px;
          border-radius: 20px;
          font-family: 'Comic Sans MS', cursive, sans-serif;
          font-size: 14px;
          text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
        "
      >
        🤘 You've been awesome for
        <span id="awesome-time">0:00</span>
      </div>
      <share-button label="🤘 Share" theme="gradient"></share-button>
    </div>
    <div id="start" class="flex items-center justify-center min-h-screen bg-gray-800">
      <button
        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transform transition-transform duration-300 hover:scale-105"
      >
        Click to start awesome!
      </button>
    </div>
    <script id="awesome_script">
      document.addEventListener('DOMContentLoaded', function () {
        var awesome = new awesomeNamespace.Awesome();
        window.scroll(0, 0);

        // Configure share button with awesome time from the Awesome instance
        var shareBtn = document.querySelector('share-button');
        if (shareBtn) {
          shareBtn.textGenerator = function () {
            if (awesome.hasStarted) {
              return awesome.getAwesomeMessage();
            }
            return '🤘 Check out this awesome experience! Everything is awesome! 🎉';
          };
        }
      });
    </script>
