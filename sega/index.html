<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sega Genesis Emulator — moved to /emulator/sega/</title>

    <meta
      name="description"
      content="The Sega Genesis / Mega Drive emulator has moved to /emulator/sega/ — part of a unified retro emulator shell that also covers NES and Game Boy."
    />

    <!--
      /sega/ was folded into /emulator/sega/ as part of the
      shared-emulator consolidation. The unified shell uses
      EmulatorJS (genesis_plus_gx core) under the hood and shares
      its boot card, ROM browser, and identity layer with /nes/
      and /gb/. This page exists so inbound links, search results,
      and bookmarks to the old URL still work.

      Same redirect pattern as /legend-of-doom/ → /doom/?flavor=legend:
        * JS location.replace() that preserves query string / fragment
        * <link rel="canonical" href="...">
        * Visible <a> fallback for no-JS / crawlers
        * <meta name="robots" content="noindex,follow">
      (No MetaRefresh — Bing flags those.)
    -->
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://joeheyming.github.io/emulator/sega/" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>"
    />

    <link rel="stylesheet" href="/brand.css" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface-0);
        color: var(--text-1);
        font-family: var(--font-ui);
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: var(--text-2);
      }
      a {
        color: var(--accent-primary);
      }
      a:hover {
        color: var(--accent-primary-hover);
      }
      .cta {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--accent-primary);
        color: var(--text-on-accent);
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
      }
    </style>

    <script>
      // Preserve inbound query / fragment; land on the path lander.
      // replace() so the back button skips this stub.
      (function () {
        var inbound = new URLSearchParams(window.location.search);
        inbound.delete('console');
        var qs = inbound.toString();
        var target = '/emulator/sega/' + (qs ? '?' + qs : '') + (window.location.hash || '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Sega Genesis Emulator moved</h1>
      <p>
        The Sega Genesis / Mega Drive emulator now lives at
        <a href="/emulator/sega/">/emulator/sega/</a>
        as one of three consoles in the unified emulator shell.
      </p>
      <p>Redirecting you now…</p>
      <a class="cta" href="/emulator/sega/">Play Sega Genesis games →</a>
    </main>
  </body>
</html>
