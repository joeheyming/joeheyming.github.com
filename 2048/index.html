    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700;14..32,800&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div class="title-row">
          <h1>2048</h1>
          <div class="scores">
            <div class="score-box" id="score-box">
              <span class="score-label">Score</span>
              <span class="score-value" id="score">0</span>
            </div>
            <div class="score-box" id="best-box">
              <span class="score-label">Best</span>
              <span class="score-value" id="best">0</span>
            </div>
          </div>
        </div>
        <p class="tagline">
          Join the tiles, reach
          <strong>2048</strong>
          ! Use arrow keys, WASD, or swipe.
        </p>
      </header>

      <div class="toolbar">
        <button class="btn primary" id="new-game-btn" type="button">＋ New Game</button>
        <button class="btn" id="undo-btn" type="button" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
        <share-button label="📤 Share" theme="dark"></share-button>
      </div>

      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board" role="grid" aria-label="2048 board" tabindex="0">
          <div class="grid-bg" aria-hidden="true"></div>
          <div class="tiles" id="tiles" aria-live="polite"></div>
        </div>

        <div class="overlay" id="overlay" hidden>
          <div class="overlay-card">
            <div class="overlay-title" id="overlay-title">Game Over</div>
            <div class="overlay-sub" id="overlay-sub">No moves left.</div>
            <div class="overlay-actions">
              <button class="btn primary" id="overlay-continue" type="button" hidden>
                Keep Going
              </button>
              <button class="btn primary" id="overlay-restart" type="button">Try Again</button>
            </div>
          </div>
        </div>
      </div>

      <div class="help">
        <span>← ↑ → ↓ or WASD to move</span>
        <span class="sep">•</span>
        <span>Swipe on mobile</span>
        <span class="sep">•</span>
        <span>Ctrl/Cmd+Z to undo</span>
      </div>
    </main>

    <!-- D-pad / left stick → arrow keys, for TV and console browsers that
         give the controller to their own cursor instead of the page. -->
    <script src="/gamepad-keys.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
