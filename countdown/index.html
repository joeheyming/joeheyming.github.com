    <!-- Import Map for ES Modules -->

      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Outfit:wght@300;400;500;600&family=Share+Tech+Mono&display=optional"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Countdown Timer",
            "applicationCategory": "UtilityApplication",
            "operatingSystem": "Web Browser",
            "description": "Beautiful countdown timer to your special moments. Count down to New Year's, Christmas, birthdays, and any custom date with a stunning visual display.",
            "url": "https://joeheyming.github.io/countdown/",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "Real-time countdown display",
              "Preset holiday countdowns",
              "Custom date support",
              "Beautiful animations",
              "Mobile-friendly design",
              "No installation required"
            ],
            "keywords": "countdown, timer, clock, new year, christmas, event countdown",
            "inLanguage": "en"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What can I count down to?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Any future date and time. The page has presets for common events (New Year's, Christmas) and a custom date picker. The countdown shows years, days, hours, minutes, and seconds in real time."
                }
              },
              {
                "@type": "Question",
                "name": "Can I share my countdown?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The target date and label are encoded in the URL query string, so sharing the URL shares the exact same countdown — without any backend or signup."
                }
              },
              {
                "@type": "Question",
                "name": "Does the countdown keep running if I close the tab?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The countdown is a wall-clock calculation: opening the page at any future point shows the correct remaining time. There's no background process; the page reads the current time and computes the difference."
                }
              },
              {
                "@type": "Question",
                "name": "What time zone is used?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Your browser's local time zone by default. The target date is stored as an ISO timestamp so it's unambiguous across time zones — sharing a URL between two countries shows the same absolute moment in each viewer's local time."
                }
              }
            ]
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Joe Heyming",
                "item": "https://joeheyming.github.io/"
              },
              {
                "@type": "ListItem",
                "position": 2,
                "name": "Countdown Timer"
              }
            ]
          }
        ]
      }
    </script>

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body>
    <div class="stars" id="stars"></div>
    <div class="shooting-stars" id="shootingStars"></div>

    <!-- Language Selector -->
    <div class="locale-selector-wrapper">
      <locale-selector></locale-selector>
    </div>

    <div class="container">
      <header class="header">
        <h1 class="title">
          Countdown
          <span class="subtitle">— every second counts</span>
        </h1>
      </header>

      <div class="event-selector">
        <div class="event-selector-row">
          <event-autocomplete
            id="eventAutocomplete"
            placeholder="Search events..."
          ></event-autocomplete>
          <button class="toggle-custom-btn" id="toggleCustomBtn" title="Create custom event">
            <span class="toggle-icon">+</span>
            <span class="toggle-text">Custom</span>
          </button>
        </div>
        <!-- Custom Event Form (hidden by default) -->
        <div class="custom-event-form" id="customEventForm" style="display: none">
          <div class="custom-form-row">
            <button class="emoji-btn" id="emojiBtn" title="Pick emoji">📅</button>
            <div class="emoji-picker" id="emojiPicker" style="display: none">
              <div class="emoji-grid" id="emojiGrid"></div>
            </div>
            <input
              type="text"
              id="customEventName"
              class="custom-name-input"
              placeholder="Event name..."
              maxlength="50"
              aria-label="Event name"
            />
            <input
              type="datetime-local"
              id="customDate"
              class="date-input"
              aria-label="Event date and time"
            />
            <button class="custom-btn" id="setCustomBtn">Create</button>
          </div>
        </div>
      </div>

      <div class="countdown-display" id="countdownDisplay">
        <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen">
          <span class="fullscreen-icon">⛶</span>
        </button>
        <div class="event-name-row">
          <h2 class="event-name" id="eventName">New Year's Day</h2>
          <div class="year-selector" id="yearSelector">
            <button class="year-btn year-down" id="yearDown" title="Previous year">−</button>
            <input type="number" id="yearInput" class="year-input" max="2100" aria-label="Year" />
            <button class="year-btn year-up" id="yearUp" title="Next year">+</button>
          </div>
        </div>

        <!-- Display Mode Selector -->
        <div class="display-mode-row">
          <span class="display-mode-label">Display:</span>
          <display-mode-selector id="displayModeSelector" value="standard"></display-mode-selector>
        </div>

        <!-- Timer Display Components (dynamically inserted) -->
        <div class="timer-display-container" id="timerDisplayContainer"></div>

        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="target-date" id="targetDate"></p>
      </div>

      <celebration-overlay id="celebration"></celebration-overlay>

      <!-- Music Player Section -->
      <div class="music-section" id="musicSection" style="display: none">
        <youtube-player id="countdownPlayer" bordered></youtube-player>
        <button class="stop-music-btn" id="stopMusicBtn">✕ Stop</button>
      </div>

      <!-- Celebration Video Selector -->
      <div class="celebration-video-section">
        <celebration-video-selector id="celebrationVideoSelector"></celebration-video-selector>
      </div>

      <div class="action-section">
        <button class="final-countdown-btn" id="finalCountdownBtn">🎸 Make It Epic!</button>
        <button class="celebrate-btn" id="celebrateNowBtn">🎉 Celebrate Now!</button>
        <share-button label="📤 Share Countdown" theme="glass"></share-button>
      </div>
    </div>

    <script src="/achievements.js"></script>
    <script type="module" src="countdown.js"></script>
  </body>
</html>
