<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Chess — Pass-and-Play Board ♟</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟</text></svg>"
    />
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="index.css" />

    <meta
      name="description"
      content="Play chess in the browser on one board. Pass-and-play with someone beside you, or share a game code so each move is posted to a Google Form and the other player joins from their own screen. Free, no signup."
    />
    <meta name="author" content="Joe Heyming" />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="chess, board game, pass and play, browser chess, free game" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming" />
    <meta property="og:title" content="Chess — Pass-and-Play Board ♟" />
    <meta
      property="og:description"
      content="Play chess in the browser on one board. Pass-and-play beside you, or share a game code so each move is posted to a Google Form."
    />
    <meta property="og:url" content="https://joeheyming.github.io/chess/" />
    <meta property="og:image" content="https://joeheyming.github.io/chess/chess-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A chess board in the browser" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joeheyming" />
    <meta name="twitter:creator" content="@joeheyming" />
    <meta name="twitter:title" content="Chess — Pass-and-Play Board ♟" />
    <meta
      name="twitter:description"
      content="Play chess in the browser on one board. Pass-and-play beside you, or share a game code so each move is posted to a Google Form."
    />
    <meta name="twitter:image" content="https://joeheyming.github.io/chess/chess-preview.png" />

    <link rel="canonical" href="https://joeheyming.github.io/chess/" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>
    <script src="/site.js" data-nav-size="compact"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "VideoGame",
            "name": "Chess",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Web Browser",
            "description": "Pass-and-play chess in the browser, with shared games posted move by move to a Google Form.",
            "url": "https://joeheyming.github.io/chess/",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "gamePlatform": "Web Browser",
            "genre": "Board",
            "inLanguage": "en"
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Joe Heyming",
                "item": "https://joeheyming.github.io/"
              },
              { "@type": "ListItem", "position": 2, "name": "Chess" }
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap"
    />
    <script type="importmap">
      {
        "imports": {
          "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <h1>Chess</h1>
        <p class="lede">Two people, one board. Click a piece, then the square it moves to.</p>
        <p id="share-note" class="note" hidden></p>
      </header>

      <p id="boot-msg" class="note">Loading the board…</p>

      <section class="panel" aria-label="Game setup">
        <label>
          Your name
          <input id="nick" type="text" maxlength="20" autocomplete="nickname" value="Player" />
        </label>
        <div class="row setup-actions">
          <button id="local-btn" type="button">Pass and play</button>
        </div>
        <div id="shared-tools" class="shared-tools" hidden>
          <button id="create-btn" type="button">New shared game</button>
          <form id="join-form" class="join-form">
            <label>
              Game code
              <input id="join-code" type="text" maxlength="8" autocapitalize="characters" />
            </label>
            <button type="submit">Join</button>
          </form>
        </div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
      <p id="code" class="code" hidden></p>
      <div id="board" class="board" role="group" aria-label="Chess board"></div>
      <div id="promo" class="promo" hidden></div>
      <div class="tools">
        <button id="flip" class="ghost" type="button">Flip board</button>
      </div>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
