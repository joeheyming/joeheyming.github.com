<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surf — Minimal Web Browser and HTML Viewer 🌊</title>

    <meta
      name="description"
      content="Browse web pages or open local HTML files in a minimal sandboxed viewer. Navigate with an address bar, history, reload, source view, and standalone file picker—no install required."
    />
    <meta name="author" content="Joe Heyming" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAFAFA" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming" />
    <meta property="og:title" content="Surf — Minimal Web Browser and HTML Viewer 🌊" />
    <meta
      property="og:description"
      content="Browse web pages or open local HTML files in a minimal sandboxed viewer with history and source view."
    />
    <meta property="og:url" content="https://joeheyming.github.io/surf/" />
    <meta property="og:image" content="https://joeheyming.github.io/surf/surf-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joeheyming" />
    <meta name="twitter:title" content="Surf — Minimal Web Browser and HTML Viewer 🌊" />
    <meta
      name="twitter:description"
      content="Browse web pages or open local HTML files in a minimal sandboxed viewer with history and source view."
    />
    <meta name="twitter:image" content="https://joeheyming.github.io/surf/surf-preview.png" />

    <link rel="canonical" href="https://joeheyming.github.io/surf/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Surf — Minimal Web Browser and HTML Viewer",
            "alternateName": [
              "Surf",
              "HTML file viewer browser",
              "Sandboxed HTML preview",
              "Local HTML viewer",
              "View HTML file in browser",
              "suckless surf web"
            ],
            "url": "https://joeheyming.github.io/surf/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web Browser",
            "description": "Browse web pages or open a local HTML file in a sandboxed viewer. Navigate with browser controls and toggle between rendered output and raw source.",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/about/"
            },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is opening an HTML file in Surf safe?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Surf renders pages inside a sandboxed iframe that restricts top navigation, popups, and same-origin access. Scripts can run inside the preview but cannot reach into Surf or your other tabs."
                }
              },
              {
                "@type": "Question",
                "name": "Why was it inspired by suckless surf?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "suckless surf is a minimal WebKit-based browser from suckless.org. This static-site take keeps the interface focused: one page, essential navigation, local HTML preview, and source view."
                }
              },
              {
                "@type": "Question",
                "name": "Can I see the raw source?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — toggle between rendered and plain-text source views."
                }
              },
              {
                "@type": "Question",
                "name": "Are my files uploaded?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The HTML file stays on your device — Surf reads it via the standard file-input API and renders it locally. Nothing is sent to a server."
                }
              }
            ]
          }
        ]
      }
    </script>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>
    <script src="/nav.js" data-nav-size="compact"></script>

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body>
    <div id="surf-container">
      <!-- Toolbar -->
      <div id="toolbar">
        <div id="navigation-row">
          <div class="toolbar-group navigation-buttons">
            <button id="btn-back" class="icon-button" title="Back (Alt+Left)" disabled>←</button>
            <button id="btn-forward" class="icon-button" title="Forward (Alt+Right)" disabled>
              →
            </button>
            <button id="btn-reload" class="icon-button" title="Reload (Ctrl+R)" disabled>↻</button>
            <button id="btn-home" class="icon-button" title="Home">⌂</button>
          </div>
          <form id="address-form" role="search">
            <label class="visually-hidden" for="address-input">Web address</label>
            <input
              id="address-input"
              type="text"
              inputmode="url"
              autocomplete="url"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Enter a web address"
            />
            <button id="btn-go" type="submit">Go</button>
          </form>
        </div>
        <div id="document-row">
          <div class="toolbar-group">
            <button id="btn-open" title="Open HTML File (Ctrl+O)">📂 Open HTML</button>
            <input id="file-input" type="file" accept=".html,.htm,text/html" hidden />
            <button id="btn-source" title="View Source (Ctrl+U)" disabled>🔍 Source</button>
            <button id="btn-new-tab" title="Open in New Tab" disabled>↗ New Tab</button>
            <button id="btn-scripts" title="Page scripts are stripped">⚡ Scripts</button>
          </div>
          <span id="file-info" role="status">Ready</span>
        </div>
      </div>

      <!-- Landing zone -->
      <div id="landing" class="active">
        <div class="landing-content">
          <span class="icon">🌊</span>
          <h1>Surf</h1>
          <p>Enter a web address or open an HTML file.</p>
          <p class="seo-intro">
            Surf is a minimal browser and HTML viewer for Heyming OS. Navigate the web with focused
            browser controls, or preview a local page and inspect its source.
          </p>
          <button id="landing-open">Open an HTML file</button>
        </div>
      </div>

      <div id="error-view" class="hidden" role="alert">
        <span class="error-icon">⚠</span>
        <h2>Surf could not load this page</h2>
        <p id="error-message"></p>
        <p id="error-detail" class="hidden"></p>
        <div class="error-actions">
          <button id="btn-open-external" class="hidden">Open in your browser</button>
          <button id="btn-run-scripts" class="hidden">Try running its scripts</button>
        </div>
      </div>

      <!-- Rendered HTML view -->
      <iframe
        id="html-frame"
        class="hidden"
        sandbox="allow-forms allow-scripts"
        title="Surf page"
      ></iframe>

      <!-- Source view -->
      <div id="source-view" class="hidden">
        <pre id="source-code"></pre>
      </div>
    </div>

    <script src="/proxy.js"></script>
    <script src="navigation.js"></script>
    <script src="surf.js"></script>
  </body>
</html>
