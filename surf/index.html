<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="description"
      content="Open and preview HTML files in a sandboxed browser viewer. Inspired by suckless surf — view rendered pages or source code with no install required."

    <meta name="theme-color" content="#FAFAFA" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming" />
    <meta property="og:title" content="Surf — Minimal HTML Viewer" />
    <meta
      property="og:description"
      content="Open and preview HTML files in a sandboxed browser viewer. View rendered pages or source code with no install required."
    />
    <meta property="og:url" content="https://joeheyming.github.io/surf/" />
    <meta property="og:image" content="https://joeheyming.github.io/surf/surf-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joeheyming" />
    <meta name="twitter:title" content="Surf — Minimal HTML Viewer" />
    <meta
      name="twitter:description"
      content="Open and preview HTML files in a sandboxed browser viewer. View rendered pages or source code with no install required."
    />

    <link rel="canonical" href="https://joeheyming.github.io/surf/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Surf — Minimal HTML Viewer",
            "alternateName": [
              "Surf",
              "HTML file viewer browser",
              "Sandboxed HTML preview",
              "Local HTML viewer",
              "View HTML file in browser",
              "suckless surf web"
            ],
            "url": "https://joeheyming.github.io/surf/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web Browser",
            "description": "Open and preview a local HTML file in a sandboxed browser viewer. Toggle between rendered output and the raw source. Inspired by suckless surf — minimal, no install, no upload.",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/about/"
            },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is opening an HTML file in Surf safe?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Surf renders the file inside a sandboxed iframe (sandbox attribute restricts top navigation, popups, and same-origin access by default). Scripts in the file run, but they can't reach into the parent page or your other tabs."
                }
              },
              {
                "@type": "Question",
                "name": "Why was it inspired by suckless surf?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "suckless surf is a minimal WebKit-based browser from suckless.org built around the Unix-philosophy 'do one thing well' principle. This page is a static-site take on that idea: open one HTML file, see the rendered page or the source, no other features."
                }
              },
              {
                "@type": "Question",
                "name": "Can I see the raw source?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — toggle between rendered and source views. The source view is syntax-highlighted."
                }
              },
              {
                "@type": "Question",
                "name": "Are my files uploaded?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The HTML file stays on your device — Surf reads it via the standard file-input API and renders it locally. Nothing is sent to a server."
                }
              }
            ]
          }
        ]
      }
    </script>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>
    <script src="/nav.js" data-nav-size="compact"></script>

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body>
    <div id="surf-container">
      <!-- Toolbar -->
      <div id="toolbar">
        <div class="toolbar-group">
          <button id="btn-open" title="Open HTML File (Ctrl+O)">📂 Open</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-source" title="View Source (Ctrl+U)">🔍 Source</button>
        </div>
        <div class="toolbar-group">
          <button id="btn-new-tab" title="Open in New Tab" disabled>↗ New Tab</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
          <span id="file-info">No file</span>
        </div>
      </div>

      <!-- Landing zone -->
      <div id="landing" class="active">
        <div class="landing-content">
          <span class="icon">🌊</span>
          <h1>Surf</h1>
          <p>Open an HTML file to render it in a sandboxed preview.</p>
          <p class="seo-intro">
            Surf is a minimal HTML viewer for Heyming OS. Open local HTML files to see the rendered
            page or inspect the source — useful for quick previews and static page testing in the
            browser.
          </p>
        </div>
      </div>

      <!-- Rendered HTML view -->
      <iframe
        id="html-frame"
        class="hidden"
        sandbox="allow-scripts allow-same-origin"
        title="HTML preview"
      ></iframe>

      <!-- Source view -->
      <div id="source-view" class="hidden">
        <pre id="source-code"></pre>
      </div>
    </div>

    <script src="surf.js"></script>
  </body>
</html>
