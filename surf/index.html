<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surf - Minimal HTML Viewer | Joe Heyming</title>

    <meta
      name="description"
      content="Open and preview HTML files in a sandboxed browser viewer. Inspired by suckless surf — view rendered pages or source code with no install required."
    />
    <meta name="author" content="Joe Heyming" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a1a" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming" />
    <meta property="og:title" content="Surf - Minimal HTML Viewer" />
    <meta
      property="og:description"
      content="Open and preview HTML files in a sandboxed browser viewer. View rendered pages or source code with no install required."
    />
    <meta property="og:url" content="https://joeheyming.github.io/surf/" />
    <meta property="og:image" content="https://joeheyming.github.io/surf/surf-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joeheyming" />
    <meta name="twitter:title" content="Surf - Minimal HTML Viewer" />
    <meta
      name="twitter:description"
      content="Open and preview HTML files in a sandboxed browser viewer. View rendered pages or source code with no install required."
    />
    <meta name="twitter:image" content="https://joeheyming.github.io/surf/surf-preview.png" />

    <link rel="canonical" href="https://joeheyming.github.io/surf/" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>
    <script src="/back.js" data-back-size="compact"></script>
  </head>
  <body>
    <div id="surf-container">
      <!-- Toolbar -->
      <div id="toolbar">
        <div class="toolbar-group">
          <button id="btn-open" title="Open HTML File (Ctrl+O)">📂 Open</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-source" title="View Source (Ctrl+U)">🔍 Source</button>
        </div>
        <div class="toolbar-group">
          <button id="btn-new-tab" title="Open in New Tab" disabled>↗ New Tab</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
          <span id="file-info">No file</span>
        </div>
      </div>

      <!-- Landing zone -->
      <div id="landing" class="active">
        <div class="landing-content">
          <span class="icon">🌊</span>
          <h1>Surf</h1>
          <p>Open an HTML file to render it in a sandboxed preview.</p>
          <p class="seo-intro">
            Surf is a minimal HTML viewer for Heyming OS. Open local HTML files to see the rendered
            page or inspect the source — useful for quick previews and static page testing in the
            browser.
          </p>
        </div>
      </div>

      <!-- Rendered HTML view -->
      <iframe
        id="html-frame"
        class="hidden"
        sandbox="allow-scripts allow-same-origin"
        title="HTML preview"
      ></iframe>

      <!-- Source view -->
      <div id="source-view" class="hidden">
        <pre id="source-code"></pre>
      </div>
    </div>

    <script src="surf.js"></script>
  </body>
</html>
