<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <defs>
    <linearGradient id="hornGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF6347"/>
    </linearGradient>
    <linearGradient id="maneGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF69B4"/>
      <stop offset="25%" style="stop-color:#BA55D3"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="75%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#8B5CF6"/>
  
  <!-- Unicorn head (simplified) -->
  <ellipse cx="50" cy="55" rx="25" ry="28" fill="white"/>
  
  <!-- Ear -->
  <path d="M30 35 L25 20 L38 30 Z" fill="white"/>
  <path d="M32 33 L29 24 L36 30 Z" fill="#FFB6C1"/>
  
  <!-- Horn -->
  <path d="M50 28 L45 5 L55 5 Z" fill="url(#hornGradient)" stroke="#FFD700" stroke-width="1"/>
  <line x1="47" y1="20" x2="53" y2="20" stroke="#FFF" stroke-width="1" opacity="0.5"/>
  <line x1="46" y1="15" x2="54" y2="15" stroke="#FFF" stroke-width="1" opacity="0.5"/>
  <line x1="48" y1="10" x2="52" y2="10" stroke="#FFF" stroke-width="1" opacity="0.5"/>
  
  <!-- Mane -->
  <path d="M28 40 Q15 50 25 65 Q30 55 28 40" fill="url(#maneGradient)"/>
  <path d="M25 35 Q10 45 20 60 Q26 48 25 35" fill="url(#maneGradient)" opacity="0.8"/>
  <path d="M30 45 Q20 58 28 70 Q32 58 30 45" fill="url(#maneGradient)" opacity="0.9"/>
  
  <!-- Eye -->
  <ellipse cx="58" cy="50" rx="8" ry="10" fill="#2D1B69"/>
  <ellipse cx="60" cy="48" rx="3" ry="4" fill="white"/>
  
  <!-- Nostril -->
  <ellipse cx="68" cy="65" rx="2" ry="1.5" fill="#FFB6C1"/>
  
  <!-- Smile -->
  <path d="M60 70 Q68 78 75 72" stroke="#FFB6C1" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Sparkles -->
  <circle cx="75" cy="25" r="2" fill="#FFD700"/>
  <circle cx="20" cy="75" r="1.5" fill="#FFD700"/>
  <circle cx="82" cy="45" r="1.5" fill="#FF69B4"/>
</svg>

