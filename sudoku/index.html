    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "VideoGame",
            "name": "Sudoku",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Web Browser",
            "description": "Classic 9x9 Sudoku in your browser. Pencil marks, undo/redo, hints, mobile friendly.",
            "url": "https://joeheyming.github.io/sudoku/",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "gamePlatform": "Web Browser",
            "genre": "Puzzle",
            "keywords": "sudoku, puzzle, classic game, browser game",
            "inLanguage": "en"
          },
          {
            "@type": "HowTo",
            "name": "How to play Sudoku in your browser",
            "description": "Solve a 9x9 Sudoku step by step using pencil marks, hints, and undo/redo.",
            "totalTime": "PT15M",
            "tool": [
              { "@type": "HowToTool", "name": "Sudoku (https://joeheyming.github.io/sudoku/)" }
            ],
            "step": [
              {
                "@type": "HowToStep",
                "position": 1,
                "name": "Pick a difficulty",
                "text": "Tap '＋ New Game' and choose Easy, Medium, Hard, or Expert. Every generated puzzle has a unique solution, so logic alone is enough — no guessing required."
              },
              {
                "@type": "HowToStep",
                "position": 2,
                "name": "Place definite numbers",
                "text": "Tap a cell, then tap a number on the on-screen pad (or type it on a keyboard). A number must be unique within its row, column, and 3×3 box."
              },
              {
                "@type": "HowToStep",
                "position": 3,
                "name": "Use pencil marks for candidates",
                "text": "Toggle pencil mode with the 🖊️ button, then tap numbers to add or remove candidates in a cell. Use 'Auto-fill pencil marks' to seed every cell with its valid candidates and start eliminating."
              },
              {
                "@type": "HowToStep",
                "position": 4,
                "name": "Apply solving techniques",
                "text": "Look for naked singles (a cell with one candidate left), hidden singles (a candidate that only fits one cell in a unit), pairs, and pointing pairs. Expert puzzles also require X-wing or swordfish reasoning."
              },
              {
                "@type": "HowToStep",
                "position": 5,
                "name": "Use hints if you get stuck",
                "text": "Tap 💡 to reveal one safe move. The hint counter tracks how many you used so you can compare runs."
              },
              {
                "@type": "HowToStep",
                "position": 6,
                "name": "Undo and finish",
                "text": "Made a wrong move? Use Ctrl/Cmd+Z to undo, or ↺ to restart the puzzle. Fill the last cell to complete — the timer freezes and shows your run."
              }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do pencil marks work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Toggle pencil mode (the 🖊️ button) and tap numbers to add/remove candidates in a cell. Pencil mode is a separate tap target so you can plan without committing. Auto-fill pencil marks fills every cell with all valid candidates given the current grid."
                }
              },
              {
                "@type": "Question",
                "name": "Are puzzles unique-solution?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The generator validates that each puzzle has exactly one solution, so logical play always reaches the right grid without guessing."
                }
              },
              {
                "@type": "Question",
                "name": "What's the difficulty range?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Four levels: Easy, Medium, Hard, and Expert. Difficulty is set by the number of givens and the techniques required to deduce the rest — Expert puzzles need X-wing-class reasoning, not just hidden singles."
                }
              },
              {
                "@type": "Question",
                "name": "Does it work on mobile?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The grid scales to the viewport and number entry uses an on-screen pad. Undo/redo, hint, and pause are all touch-friendly."
                }
              },
              {
                "@type": "Question",
                "name": "Can I import a puzzle?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not yet — the New Game dialog generates puzzles in-browser. There's no paste-from-newspaper input today; the generator is the source of new puzzles."
                }
              }
            ]
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Joe Heyming",
                "item": "https://joeheyming.github.io/"
              },
              { "@type": "ListItem", "position": 2, "name": "Sudoku" }
            ]
          }
        ]
      }
    </script>

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>🔢 Sudoku</h1>
        <div class="badges">
          <span class="badge" id="difficulty-badge">Medium</span>
        </div>
      </header>

      <div class="toolbar">
        <button class="btn primary" id="open-newgame">＋ New Game</button>
        <button class="btn" id="restart-btn" title="Restart this puzzle">↺ Restart</button>
        <button class="btn icon-btn" id="undo-btn" title="Undo (Ctrl/Cmd+Z)">↶</button>
        <button class="btn icon-btn" id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
        <button class="btn icon-btn" id="hint-btn" title="Hint (H)">💡</button>
        <button class="btn icon-btn" id="autofill-btn" title="Auto-fill pencil marks">🖊️</button>
        <button class="btn icon-btn" id="pause-btn" title="Pause">⏸</button>
      </div>

      <div class="status-bar">
        <div class="stat">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="timer">0:00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Hints</span>
          <span class="stat-value" id="hints-count">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Mistakes</span>
          <span class="stat-value" id="mistakes-count">0</span>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="group" aria-label="Sudoku board"></div>
        <div class="pause-overlay" id="pause-overlay">
          <div class="pause-message">
            <div class="pause-icon">⏸</div>
            <div>Paused — tap to resume</div>
          </div>
        </div>
      </div>

      <div class="message" id="message" aria-live="polite"></div>

      <div class="numpad" id="numpad" aria-label="Number pad"></div>

      <div class="settings-row">
        <button class="toggle" id="notes-toggle" aria-pressed="false">
          <span class="toggle-icon">✏️</span>
          <span>Notes</span>
          <span class="kbd">N</span>
        </button>
        <button class="toggle" id="auto-check" aria-pressed="true">
          <span class="toggle-icon">✓</span>
          <span>Auto-check</span>
        </button>
        <button class="toggle" id="highlight-same" aria-pressed="true">
          <span class="toggle-icon">🔆</span>
          <span>Highlight</span>
        </button>
        <button class="toggle" id="auto-remove-notes" aria-pressed="true">
          <span class="toggle-icon">🧽</span>
          <span>Auto-clean</span>
        </button>
      </div>

      <div class="help">
        <span>Arrows to move • 1–9 to fill • N for notes • H for hint</span>
        <span class="sep">•</span>
        <share-button label="📤 Share" theme="dark"></share-button>
      </div>
    </main>

    <!-- New Game Modal -->
    <div class="modal" id="newgame-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>New Game</h2>
          <button class="modal-close" data-close-modal="newgame-modal">×</button>
        </div>
        <form id="newgame-form" class="modal-body">
          <fieldset class="field-group">
            <legend>Difficulty</legend>
            <div class="radio-group">
              <label class="radio-pill">
                <input type="radio" name="difficulty" value="easy" />
                <span>Easy</span>
              </label>
              <label class="radio-pill">
                <input type="radio" name="difficulty" value="medium" checked />
                <span>Medium</span>
              </label>
              <label class="radio-pill">
                <input type="radio" name="difficulty" value="hard" />
                <span>Hard</span>
              </label>
              <label class="radio-pill">
                <input type="radio" name="difficulty" value="expert" />
                <span>Expert</span>
              </label>
            </div>
          </fieldset>

          <div class="form-buttons">
            <button type="button" class="btn" data-close-modal="newgame-modal">Cancel</button>
            <button type="submit" class="btn primary">Start</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/achievements.js"></script>
    <script type="module" src="sudoku.js"></script>
  </body>
</html>
