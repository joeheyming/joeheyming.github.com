<html lang="en" class="h-full">
  <head>

    />

    <title>✅ Todo — Google Sheets task lists | Joe Heyming</title>

    <meta
      name="description"
      content="Free browser todo app: sign in with Google and keep tasks in your own spreadsheet. Multiple lists (tabs), rename lists, add and edit todos—works on phone and desktop."
    />
    <meta name="author" content="Joe Heyming" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming — Todo" />
    <meta property="og:title" content="✅ Todo — Google Sheets task lists" />
    <meta
      property="og:description"
      content="Sign in with Google and manage todos in a spreadsheet. Multiple lists, rename tabs, add and remove tasks—mobile friendly."
    />
    <meta property="og:url" content="https://joeheyming.github.io/todo/" />
    <meta
      property="og:image"
      content="https://joeheyming.github.io/assets/joe-heyming-og-image.png"

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joeheyming" />
    <meta name="twitter:creator" content="@joeheyming" />
    <meta name="twitter:title" content="✅ Todo — Google Sheets task lists" />
    <meta
      name="twitter:description"
      content="Sign in with Google and manage todos in a spreadsheet. Works on phone and desktop."
    />
    <meta
      name="twitter:image"
      content="https://joeheyming.github.io/assets/joe-heyming-og-image.png"
    />

    <link rel="canonical" href="https://joeheyming.github.io/todo/" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Todo" />

    <!-- width=device-width + initial-scale=1 is the standard mobile setup; viewport-fit helps notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'media',
        theme: {
          extend: {
            fontFamily: {
              sans: ['DM Sans', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    </script>
  </head>
  <body
    class="min-h-full bg-gradient-to-br from-violet-100/90 via-zinc-50 to-fuchsia-50/70 font-sans text-zinc-900 antialiased dark:from-zinc-950 dark:via-zinc-900 dark:to-violet-950/40 dark:text-zinc-100"
  >
    <div class="mx-auto flex min-h-screen max-w-xl flex-col px-4 pb-4 pt-6 sm:px-6">
      <header class="mb-6 flex flex-nowrap items-center justify-between gap-3">
        <h1
          class="shrink-0 bg-gradient-to-r from-violet-700 to-fuchsia-600 bg-clip-text text-2xl font-semibold tracking-tight text-transparent dark:from-violet-300 dark:to-fuchsia-400"
        >
          Todo App
        </h1>
        <div
          id="status"
          class="min-w-0 flex-1 break-words text-right empty:hidden text-xs text-zinc-500 dark:text-zinc-400 sm:text-sm"
          role="status"
        ></div>
      </header>

      <div class="min-h-0 flex-1">
        <div
          id="todo-panel"
          class="mb-4 rounded-2xl border border-zinc-200/90 bg-white/85 p-4 shadow-xl shadow-zinc-200/40 backdrop-blur-md dark:border-zinc-700/90 dark:bg-zinc-900/85 dark:shadow-black/30"
          hidden
        >
          <div class="mb-3 flex flex-nowrap items-center gap-2">
            <label
              for="sheet-tab-select"
              class="shrink-0 text-[0.7rem] font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400"
            >
              List
            </label>
            <select
              id="sheet-tab-select"
              aria-label="Todo list tab"
              class="min-w-0 flex-1 cursor-pointer rounded-xl border border-zinc-200 bg-white px-3 py-2 text-sm shadow-sm dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-100"
            ></select>
            <button
              type="button"
              id="btn-open-add-list"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-zinc-200 bg-white text-lg shadow-sm transition hover:border-violet-400 hover:bg-violet-50 hover:shadow dark:border-zinc-600 dark:bg-zinc-800 dark:hover:border-violet-500 dark:hover:bg-violet-950/50"
              aria-label="Add list"
              title="Add list"
            >
              ➕
            </button>
            <button
              type="button"
              id="btn-open-rename"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-zinc-200 bg-white text-lg shadow-sm transition hover:border-violet-400 hover:bg-violet-50 hover:shadow dark:border-zinc-600 dark:bg-zinc-800 dark:hover:border-violet-500 dark:hover:bg-violet-950/50"
              aria-label="Rename list"
              title="Rename list"
            >
              ✏️
            </button>
            <button
              type="button"
              id="btn-remove-list"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-zinc-200 bg-white text-lg shadow-sm transition hover:border-rose-400 hover:bg-rose-50 dark:border-zinc-600 dark:bg-zinc-800 dark:hover:border-rose-500 dark:hover:bg-rose-950/40"
              aria-label="Remove list"
              title="Remove list"
            >
              🗑️
            </button>
          </div>
          <form
            class="mb-1 flex flex-wrap items-center gap-2"
            id="new-todo-form"
            novalidate
            aria-label="Add new todo"
          >
            <label for="new-title" class="sr-only">New todo</label>
            <input
              type="text"
              id="new-title"
              name="title"
              placeholder="New todo…"
              maxlength="500"
              autocomplete="off"
              class="min-w-0 flex-1 rounded-xl border border-zinc-200 bg-white px-3 py-2.5 text-base placeholder:text-zinc-400 focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-400/30 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-100 dark:placeholder:text-zinc-500 dark:focus:border-violet-500 dark:focus:ring-violet-500/30"
            />
            <button
              type="submit"
              id="btn-add"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-violet-200 bg-violet-50 text-lg shadow-sm transition hover:border-violet-400 hover:bg-violet-100 dark:border-violet-800 dark:bg-violet-950/60 dark:hover:bg-violet-900/60"
              aria-label="Add todo"
            >
              ➕
            </button>
          </form>
          <ul
            class="list-none divide-y divide-zinc-200/90 dark:divide-zinc-700"
            id="todo-list"
          ></ul>
          <p class="mt-3 text-sm text-zinc-500 dark:text-zinc-400" id="todo-empty" hidden>
            No rows yet. Add one above.
          </p>
        </div>
      </div>

      <footer
        id="auth-card"
        class="mt-auto flex flex-wrap items-center justify-start gap-3 rounded-2xl border border-zinc-200/90 bg-white/85 p-4 shadow-xl shadow-zinc-200/40 backdrop-blur-md dark:border-zinc-700/90 dark:bg-zinc-900/85 dark:shadow-black/30"
      >
        <div class="flex flex-wrap items-center gap-2">
          <button
            type="button"
            id="btn-signout"
            class="rounded-full border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-800 shadow-sm transition hover:border-zinc-400 hover:bg-zinc-50 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700"
            hidden
          >
            Sign out
          </button>
          <button
            type="button"
            id="btn-signin"
            class="rounded-full border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-800 shadow-sm transition hover:border-violet-400 hover:bg-violet-50 dark:border-zinc-600 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:border-violet-500 dark:hover:bg-zinc-700"
          >
            Sign in with Google
          </button>
        </div>
      </footer>
    </div>

    <!-- Dialogs: cloned into body by app.js -->
    <template id="tpl-rename-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-zinc-900 dark:text-zinc-100 [&::backdrop]:bg-zinc-950/55"
        aria-labelledby="rename-dialog-title"
      >
        <div
          class="min-w-[min(18rem,100vw-2rem)] rounded-2xl border border-zinc-200/90 bg-white/95 p-5 shadow-2xl backdrop-blur-md dark:border-zinc-700 dark:bg-zinc-900/95"
        >
          <h2
            id="rename-dialog-title"
            class="text-lg font-semibold text-zinc-900 dark:text-zinc-100"
          >
            Rename list
          </h2>
          <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">
            Updates the tab name in Google Sheets.
          </p>
          <label
            class="mt-4 block text-[0.7rem] font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400"
            for="rename-dialog-input"
          >
            New name
          </label>
          <input
            type="text"
            id="rename-dialog-input"
            maxlength="100"
            autocomplete="off"
            class="mt-1.5 w-full rounded-xl border border-zinc-200 bg-zinc-50 px-3 py-2 text-base focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-400/30 dark:border-zinc-600 dark:bg-zinc-950 dark:text-zinc-100 dark:focus:border-violet-500 dark:focus:ring-violet-500/30"
          />
          <div class="mt-5 flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="rounded-full border border-zinc-300 bg-white px-4 py-2 text-sm font-medium shadow-sm hover:bg-zinc-50 dark:border-zinc-600 dark:bg-zinc-800 dark:hover:bg-zinc-700"
              data-rename="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="rounded-full border border-violet-600 bg-violet-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-violet-700 dark:border-violet-500 dark:bg-violet-600 dark:hover:bg-violet-500"
              data-rename="ok"
            >
              Rename
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="tpl-add-list-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-zinc-900 dark:text-zinc-100 [&::backdrop]:bg-zinc-950/55"
        aria-label="New list"
      >
        <div
          class="min-w-[min(20rem,100vw-2rem)] rounded-xl border border-zinc-300 bg-gradient-to-b from-zinc-50 to-zinc-100/90 p-4 shadow-2xl dark:border-zinc-600 dark:from-zinc-800 dark:to-zinc-900/95"
        >
          <p class="mb-2 text-sm text-zinc-700 dark:text-zinc-200" id="add-list-prompt-message"></p>
          <input
            type="text"
            id="add-list-prompt-input"
            maxlength="100"
            autocomplete="off"
            aria-describedby="add-list-prompt-message"
            class="mb-3 w-full rounded-lg border border-zinc-300 bg-white px-2.5 py-2 text-base shadow-inner focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-400/25 dark:border-zinc-500 dark:bg-zinc-950 dark:text-zinc-100"
          />
          <div class="flex justify-end gap-2">
            <button
              type="button"
              class="min-w-[4.5rem] rounded-md border border-zinc-400 bg-gradient-to-b from-white to-zinc-100 px-3 py-1.5 text-sm font-medium text-zinc-800 shadow-sm hover:from-zinc-50 dark:border-zinc-500 dark:from-zinc-700 dark:to-zinc-800 dark:text-zinc-100"
              data-add-list="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="min-w-[4.5rem] rounded-md border border-violet-600 bg-gradient-to-b from-violet-500 to-violet-600 px-3 py-1.5 text-sm font-semibold text-white shadow-sm hover:from-violet-600 hover:to-violet-700 dark:border-violet-500"
              data-add-list="ok"
            >
              OK
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="tpl-remove-list-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-zinc-900 dark:text-zinc-100 [&::backdrop]:bg-zinc-950/55"
        aria-labelledby="remove-list-dialog-title"
      >
        <div
          class="min-w-[min(18rem,100vw-2rem)] rounded-2xl border border-zinc-200/90 bg-white/95 p-5 shadow-2xl backdrop-blur-md dark:border-zinc-700 dark:bg-zinc-900/95"
        >
          <h2
            id="remove-list-dialog-title"
            class="text-lg font-semibold text-zinc-900 dark:text-zinc-100"
          >
            Remove list
          </h2>
          <p class="mt-2 text-sm leading-relaxed text-zinc-600 dark:text-zinc-300">
            Delete the tab
            <strong id="remove-list-name" class="text-zinc-900 dark:text-zinc-100"></strong>
            from this spreadsheet? All todos on that list are removed. This cannot be undone.
          </p>
          <div class="mt-5 flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="rounded-full border border-zinc-300 bg-white px-4 py-2 text-sm font-medium shadow-sm hover:bg-zinc-50 dark:border-zinc-600 dark:bg-zinc-800 dark:hover:bg-zinc-700"
              data-remove-list="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="rounded-full border border-rose-600 bg-rose-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-rose-700 dark:border-rose-500 dark:bg-rose-600 dark:hover:bg-rose-500"
              data-remove-list="ok"
            >
              Remove
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <script src="/share.js"></script>
    <script src="https://apis.google.com/js/api.js" defer></script>
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
