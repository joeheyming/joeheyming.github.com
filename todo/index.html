<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <base href="./" />
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>"
    />

    <title>Todo — Google Sheets task lists | Joe Heyming ✅</title>

    <meta
      name="description"
      content="Free browser todo app: sign in with Google and keep tasks in your own spreadsheet. Multiple lists (tabs), rename lists, add and edit todos—works on phone and desktop."
    />
    <meta name="author" content="Joe Heyming" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta
      name="keywords"
      content="todo list, Google Sheets, task manager, productivity, sign in with Google, browser todo, mobile friendly"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming — Todo" />
    <meta property="og:title" content="✅ Todo — Google Sheets task lists" />
    <meta
      property="og:description"
      content="Sign in with Google and manage todos in a spreadsheet. Multiple lists, rename tabs, add and remove tasks—mobile friendly."
    />
    <meta property="og:url" content="https://joeheyming.github.io/todo/" />
    <meta property="og:image" content="https://joeheyming.github.io/todo/todo-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joe Heyming — projects and apps" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joeheyming" />
    <meta name="twitter:creator" content="@joeheyming" />
    <meta name="twitter:title" content="✅ Todo — Google Sheets task lists" />
    <meta
      name="twitter:description"
      content="Sign in with Google and manage todos in a spreadsheet. Works on phone and desktop."
    />
    <meta name="twitter:image" content="https://joeheyming.github.io/todo/todo-preview.png" />

    <link rel="canonical" href="https://joeheyming.github.io/todo/" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Todo" />

    <!-- width=device-width + initial-scale=1 is the standard mobile setup; viewport-fit helps notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CDN must load BEFORE brand-tailwind.js — the CDN
         installs window.tailwind on boot and overwrites any pre-set
         config, so brand-tailwind.js sets `tailwind.config` after. -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="/brand-tailwind.js"></script>
    <style>
      /* Back button clearance when CDN stylesheet fails to load */
      #todo-app-root {
        padding-top: 4rem;
      }
      /* HTML [hidden] loses to Tailwind utilities like `flex` on the same node — force collapse. */
      #signed-out-empty[hidden],
      #app-loading[hidden] {
        display: none !important;
      }
      /* Never show sign-out footer while signed-out or loading is visible */
      #todo-app-root:has(#signed-out-empty:not([hidden])) #auth-card,
      #todo-app-root:has(#app-loading:not([hidden])) #auth-card {
        display: none !important;
      }
      /* Safety net: pin <html> to brand surface-0 so any transparent
       * region in the body gradient (the Tailwind `/40`, `/70`, `/90`
       * stops are partially transparent) shows brand dark, not UA white. */
      html {
        background-color: var(--surface-0);
      }
    </style>
    <script src="/back.js"></script>
    <script src="/feedback.js"></script>

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body
    class="min-h-full bg-gradient-to-br from-surface-0 via-surface-1 to-accent-primary/15 font-ui text-text-1 antialiased"
  >
    <div
      id="todo-app-root"
      class="mx-auto flex min-h-dvh max-w-xl flex-col px-4 pt-16 sm:px-6 pb-[max(1.25rem,env(safe-area-inset-bottom,0px))]"
    >
      <header class="mb-6 flex flex-nowrap items-center justify-between gap-3">
        <h1
          class="shrink-0 bg-gradient-to-r from-accent-primary-hover to-accent-primary bg-clip-text text-2xl font-semibold tracking-tight text-transparent"
        >
          Todo App
        </h1>
        <div
          id="status"
          class="min-w-0 flex-1 break-words text-right empty:hidden text-xs text-text-2 sm:text-sm"
          role="status"
        ></div>
      </header>

      <div class="min-h-0 flex flex-1 flex-col">
        <div
          id="app-loading"
          class="flex min-h-[min(52vh,28rem)] flex-1 flex-col items-center justify-center px-1 py-6 sm:py-10"
          role="status"
          aria-live="polite"
          hidden
        >
          <div
            class="w-full max-w-md rounded-2xl border border-hairline bg-surface-1/90 p-8 text-center shadow-xl shadow-black/40 backdrop-blur-md"
          >
            <div
              class="mx-auto mb-4 h-11 w-11 animate-spin rounded-full border-2 border-hairline border-t-accent-primary"
              aria-hidden="true"
            ></div>
            <p id="app-loading-message" class="text-sm font-medium text-text-1">
              Connecting to Google…
            </p>
            <p class="mt-2 text-xs text-text-2">
              Talking to Google APIs; you’re still signed in if you have a session.
            </p>
          </div>
        </div>
        <div
          id="signed-out-empty"
          class="flex min-h-[min(52vh,28rem)] flex-1 flex-col items-center justify-center px-1 py-6 sm:py-10"
          role="region"
          aria-label="Signed out"
        >
          <div
            class="w-full max-w-md rounded-2xl border border-hairline-accent bg-surface-1/90 p-8 text-center shadow-xl shadow-black/40 backdrop-blur-md"
          >
            <p class="mb-3 text-4xl leading-none" aria-hidden="true">🔓</p>
            <h2 id="signed-out-empty-title" class="text-lg font-semibold text-text-1 sm:text-xl">
              You’re signed out
            </h2>
            <p id="signed-out-empty-body" class="mt-2 text-sm leading-relaxed text-text-2">
              Sign in with Google to open your spreadsheet and load your lists.
            </p>
            <button
              type="button"
              id="btn-signin"
              class="mt-6 w-full rounded-full border border-hairline-accent bg-accent-primary/15 px-5 py-3 text-sm font-semibold text-accent-primary shadow-sm transition hover:border-accent-primary hover:bg-accent-primary/25 sm:w-auto sm:px-8"
            >
              Sign in with Google
            </button>
          </div>
        </div>
        <div
          id="todo-panel"
          class="mb-4 rounded-2xl border border-hairline bg-surface-1/85 p-4 shadow-xl shadow-black/40 backdrop-blur-md"
          hidden
        >
          <div class="mb-3 flex flex-nowrap items-center gap-2">
            <label
              for="sheet-tab-select"
              class="shrink-0 text-[0.7rem] font-semibold uppercase tracking-wider text-text-2"
            >
              List
            </label>
            <select
              id="sheet-tab-select"
              aria-label="Todo list tab"
              class="min-w-0 flex-1 cursor-pointer rounded-xl border border-hairline bg-surface-2 px-3 py-2 text-sm text-text-1 shadow-sm"
            ></select>
            <button
              type="button"
              id="btn-open-add-list"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-hairline bg-surface-2 text-lg shadow-sm transition hover:border-accent-primary hover:bg-accent-primary/15 hover:shadow"
              aria-label="Add list"
              title="Add list"
            >
              ➕
            </button>
            <button
              type="button"
              id="btn-open-rename"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-hairline bg-surface-2 text-lg shadow-sm transition hover:border-accent-primary hover:bg-accent-primary/15 hover:shadow"
              aria-label="Rename list"
              title="Rename list"
            >
              ✏️
            </button>
            <button
              type="button"
              id="btn-remove-list"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-hairline bg-surface-2 text-lg shadow-sm transition hover:border-danger hover:bg-danger/15"
              aria-label="Remove list"
              title="Remove list"
            >
              🗑️
            </button>
            <button
              type="button"
              id="btn-open-share-list"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-hairline bg-surface-2 text-lg shadow-sm transition hover:border-accent-primary hover:bg-accent-primary/15"
              aria-label="Share list"
              title="Share list (new Drive file + invite)"
            >
              👥
            </button>
            <button
              type="button"
              id="btn-open-add-shared"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-hairline bg-surface-2 text-lg shadow-sm transition hover:border-accent-primary hover:bg-accent-primary/15"
              aria-label="Open shared spreadsheet"
              title="Open a list shared with you (paste spreadsheet link or id)"
            >
              🔗
            </button>
          </div>
          <form
            class="mb-1 flex flex-wrap items-center gap-2"
            id="new-todo-form"
            novalidate
            aria-label="Add new todo"
          >
            <label for="new-title" class="sr-only">New todo</label>
            <input
              type="text"
              id="new-title"
              name="title"
              placeholder="New todo…"
              maxlength="500"
              autocomplete="off"
              class="min-w-0 flex-1 rounded-xl border border-hairline bg-surface-2 px-3 py-2.5 text-base text-text-1 placeholder:text-text-3 focus:border-accent-primary focus:outline-none focus:ring-2 focus:ring-accent-primary/30"
            />
            <button
              type="submit"
              id="btn-add"
              class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-hairline-accent bg-accent-primary/15 text-lg shadow-sm transition hover:border-accent-primary hover:bg-accent-primary/25"
              aria-label="Add todo"
            >
              ➕
            </button>
          </form>
          <ul class="list-none divide-y divide-hairline" id="todo-list"></ul>
          <p class="mt-3 text-sm text-text-2" id="todo-empty" hidden>No rows yet. Add one above.</p>
        </div>
      </div>

      <footer
        id="auth-card"
        hidden
        class="mt-auto flex flex-wrap items-center justify-start gap-3 rounded-2xl border border-hairline bg-surface-1/85 p-4 shadow-xl shadow-black/40 backdrop-blur-md"
      >
        <button
          type="button"
          id="btn-signout"
          class="rounded-full border border-hairline bg-surface-2 px-4 py-2 text-sm font-medium text-text-1 shadow-sm transition hover:border-hairline-strong hover:bg-surface-1"
        >
          Sign out
        </button>
      </footer>
    </div>

    <!-- Dialogs: cloned into body by app.js -->
    <template id="tpl-rename-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-text-1 [&::backdrop]:bg-surface-0/60"
        aria-labelledby="rename-dialog-title"
      >
        <div
          class="min-w-[min(18rem,100vw-2rem)] rounded-2xl border border-hairline bg-surface-1/95 p-5 shadow-2xl backdrop-blur-md"
        >
          <h2 id="rename-dialog-title" class="text-lg font-semibold text-text-1">Rename list</h2>
          <p class="mt-1 text-sm text-text-2">Updates the tab name in Google Sheets.</p>
          <label
            class="mt-4 block text-[0.7rem] font-semibold uppercase tracking-wider text-text-2"
            for="rename-dialog-input"
          >
            New name
          </label>
          <input
            type="text"
            id="rename-dialog-input"
            maxlength="100"
            autocomplete="off"
            class="mt-1.5 w-full rounded-xl border border-hairline bg-surface-2 px-3 py-2 text-base text-text-1 focus:border-accent-primary focus:outline-none focus:ring-2 focus:ring-accent-primary/30"
          />
          <div class="mt-5 flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="rounded-full border border-hairline bg-surface-2 px-4 py-2 text-sm font-medium text-text-1 shadow-sm hover:bg-surface-1"
              data-rename="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="rounded-full border border-accent-primary-bg bg-accent-primary-bg px-4 py-2 text-sm font-medium text-text-on-accent shadow-sm hover:bg-accent-primary-bg-hover"
              data-rename="ok"
            >
              Rename
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="tpl-add-list-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-text-1 [&::backdrop]:bg-surface-0/60"
        aria-label="New list"
      >
        <div
          class="min-w-[min(20rem,100vw-2rem)] rounded-xl border border-hairline bg-gradient-to-b from-surface-1 to-surface-2 p-4 shadow-2xl"
        >
          <p class="mb-2 text-sm text-text-2" id="add-list-prompt-message"></p>
          <input
            type="text"
            id="add-list-prompt-input"
            maxlength="100"
            autocomplete="off"
            aria-describedby="add-list-prompt-message"
            class="mb-3 w-full rounded-lg border border-hairline bg-surface-2 px-2.5 py-2 text-base text-text-1 shadow-inner focus:border-accent-primary focus:outline-none focus:ring-2 focus:ring-accent-primary/25"
          />
          <div class="flex justify-end gap-2">
            <button
              type="button"
              class="min-w-[4.5rem] rounded-md border border-hairline bg-surface-2 px-3 py-1.5 text-sm font-medium text-text-1 shadow-sm hover:bg-surface-1"
              data-add-list="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="min-w-[4.5rem] rounded-md border border-accent-primary-bg bg-gradient-to-b from-accent-primary to-accent-primary-bg px-3 py-1.5 text-sm font-semibold text-text-on-accent shadow-sm hover:from-accent-primary-hover hover:to-accent-primary-bg-hover"
              data-add-list="ok"
            >
              OK
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="tpl-remove-list-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-text-1 [&::backdrop]:bg-surface-0/60"
        aria-labelledby="remove-list-dialog-title"
      >
        <div
          class="min-w-[min(18rem,100vw-2rem)] rounded-2xl border border-hairline bg-surface-1/95 p-5 shadow-2xl backdrop-blur-md"
        >
          <h2 id="remove-list-dialog-title" class="text-lg font-semibold text-text-1">
            Remove list
          </h2>
          <p id="remove-list-detail" class="mt-2 text-sm leading-relaxed text-text-2">
            Delete the tab
            <strong id="remove-list-name" class="text-text-1"></strong>
            from this spreadsheet? All todos on that list are removed. This cannot be undone.
          </p>
          <div class="mt-5 flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="rounded-full border border-hairline bg-surface-2 px-4 py-2 text-sm font-medium text-text-1 shadow-sm hover:bg-surface-1"
              data-remove-list="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="rounded-full border border-danger bg-danger px-4 py-2 text-sm font-medium text-text-on-accent shadow-sm hover:bg-danger/90"
              data-remove-list="ok"
            >
              Remove
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="tpl-share-list-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-text-1 [&::backdrop]:bg-surface-0/60"
        aria-labelledby="share-list-dialog-title"
      >
        <div
          class="min-w-[min(20rem,100vw-2rem)] rounded-2xl border border-hairline bg-surface-1/95 p-5 shadow-2xl backdrop-blur-md"
        >
          <h2 id="share-list-dialog-title" class="text-lg font-semibold text-text-1">Share list</h2>
          <p class="mt-2 text-sm leading-relaxed text-text-2">
            Moves this list into a
            <strong>new</strong>
            Google spreadsheet and invites collaborators as editors. Your main workbook will only
            keep a link in its manifest (the old tab is removed). If this list is already shared,
            new emails are added to the same file.
          </p>
          <label
            class="mt-4 block text-[0.7rem] font-semibold uppercase tracking-wider text-text-2"
            for="share-list-emails-input"
          >
            Email addresses (comma or space separated)
          </label>
          <textarea
            id="share-list-emails-input"
            rows="3"
            autocomplete="off"
            class="mt-1.5 w-full rounded-xl border border-hairline bg-surface-2 px-3 py-2 text-base text-text-1 focus:border-accent-primary focus:outline-none focus:ring-2 focus:ring-accent-primary/30"
            placeholder="friend@example.com"
          ></textarea>
          <div class="mt-5 flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="rounded-full border border-hairline bg-surface-2 px-4 py-2 text-sm font-medium text-text-1 shadow-sm hover:bg-surface-1"
              data-share-list="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="rounded-full border border-accent-primary-bg bg-accent-primary-bg px-4 py-2 text-sm font-medium text-text-on-accent shadow-sm hover:bg-accent-primary-bg-hover"
              data-share-list="ok"
            >
              Share
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <template id="tpl-open-shared-dialog">
      <dialog
        class="max-w-[calc(100vw-2rem)] border-0 bg-transparent p-0 text-text-1 [&::backdrop]:bg-surface-0/60"
        aria-labelledby="open-shared-dialog-title"
      >
        <div
          class="min-w-[min(20rem,100vw-2rem)] rounded-2xl border border-hairline bg-surface-1/95 p-5 shadow-2xl backdrop-blur-md"
        >
          <h2 id="open-shared-dialog-title" class="text-lg font-semibold text-text-1">
            Open shared spreadsheet
          </h2>
          <p class="mt-2 text-sm leading-relaxed text-text-2">
            Paste a Google Sheets link or spreadsheet id for a file someone shared with you. Lists
            whose tab names start with
            <code class="text-xs">todo-app-</code>
            will appear in the list menu.
          </p>
          <label
            class="mt-4 block text-[0.7rem] font-semibold uppercase tracking-wider text-text-2"
            for="open-shared-input"
          >
            Link or id
          </label>
          <input
            type="text"
            id="open-shared-input"
            autocomplete="off"
            class="mt-1.5 w-full rounded-xl border border-hairline bg-surface-2 px-3 py-2 text-base text-text-1 focus:border-accent-primary focus:outline-none focus:ring-2 focus:ring-accent-primary/30"
            placeholder="https://docs.google.com/spreadsheets/d/…"
          />
          <div class="mt-5 flex flex-wrap justify-end gap-2">
            <button
              type="button"
              class="rounded-full border border-hairline bg-surface-2 px-4 py-2 text-sm font-medium text-text-1 shadow-sm hover:bg-surface-1"
              data-open-shared="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="rounded-full border border-accent-primary-bg bg-accent-primary-bg px-4 py-2 text-sm font-medium text-text-on-accent shadow-sm hover:bg-accent-primary-bg-hover"
              data-open-shared="ok"
            >
              Add lists
            </button>
          </div>
        </div>
      </dialog>
    </template>

    <script src="/share.js"></script>
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
