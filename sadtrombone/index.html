  <body style="overflow: hidden">
    <div class="background-particles" id="particles"></div>
    <div class="confetti-container" id="tearsContainer"></div>

    <div class="container">
      <h1 class="title">🎺 Sad Trombone Symphony 🎺</h1>
      <p class="subtitle">Express your disappointment in spectacular fashion!</p>

      <div class="scenario-box" id="scenarioBox">
        <div class="scenario-text" id="scenarioText">
          Click the button when life gives you lemons 🍋... but you wanted oranges 🍊
        </div>
      </div>

      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          margin: 20px 0;
        "
      >
        <span style="font-size: 0.9em; opacity: 0.8">Need a different scenario?</span>
        <button class="scenario-refresh-btn" onclick="randomScenario()" title="Get new scenario">
          🎲
        </button>
      </div>

      <div class="trombone-container">
        <img
          id="tromboneImg"
          class="trombone-img hidden"
          src="trombone_sliding.gif"
          alt="Sad Trombone"
        />
      </div>

      <div class="controls">
        <button class="main-button" id="mainButton">💔 Express Sadness 💔</button>

        <div class="sadness-meter">
          <div class="meter-label">
            Sadness Intensity:
            <span class="sadness-level" id="sadnessLevel">Mildly Disappointed</span>
          </div>
          <input
            type="range"
            class="slider"
            id="sadnessSlider"
            min="1"
            max="10"
            value="5"
            aria-label="Sadness intensity"
          />
        </div>
      </div>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="sadCount">0</span>
          <span class="stat-label">Times Sad</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="totalSadness">0</span>
          <span class="stat-label">Total Sadness</span>
        </div>
      </div>

      <div class="share-buttons">
        <share-button
          id="share-sadness-btn"
          label="📱 Share Your Sadness"
          theme="glass"
          title="Sad Trombone Symphony"
        ></share-button>
        <button class="share-btn" onclick="resetStats()">🔄 Reset Stats</button>
      </div>
    </div>

    <audio id="trombone" src="trombone.ogg" preload="auto"></audio>

    <script src="index.js"></script>
  </body>
