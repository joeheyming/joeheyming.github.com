    />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>
    <script src="/nav.js" data-nav-size="compact"></script>
    <script src="/feedback.js"></script>
    <script src="/share.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Blockbuster",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Web Browser",
            "description": "Walk a 3D video store and rent movies that play in Watch from the Internet Archive.",
            "url": "https://joeheyming.github.io/blockbuster/",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "First-person store walkthrough",
              "Movie boxes from the Watch catalog",
              "Opens playback in Watch"
            ],
            "keywords": "blockbuster, video store, 3d, movies, vhs"
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://joeheyming.github.io/"
              },
              {
                "@type": "ListItem",
                "position": 2,
                "name": "Blockbuster",
                "item": "https://joeheyming.github.io/blockbuster/"
              }
            ]
          }
        ]
      }
    </script>

    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="store-canvas" tabindex="0" aria-label="Video store 3D view"></canvas>

      <div id="hud" class="hud">
        <header class="hud-brand">
          <h1 class="hud-logo">Blockbuster</h1>
          <p class="hud-tag">Be kind — rewind</p>
          <button
            id="mute-btn"
            class="mute-btn"
            type="button"
            hidden
            aria-pressed="false"
            title="Mute store ambience"
          >
            Mute
          </button>
        </header>

        <div class="crosshair" aria-hidden="true"></div>

        <p id="challenge-banner" class="challenge-banner" hidden></p>

        <div id="target-card" class="target-card" hidden>
          <p id="target-title" class="target-title"></p>
          <p id="target-tagline" class="target-tagline"></p>
          <p id="target-hint" class="target-hint">
            Click or press
            <kbd>E</kbd>
            to pick up
          </p>
        </div>

        <p id="load-status" class="load-status">Stocking shelves…</p>

        <footer class="hud-footer">
          <p class="hud-keys hud-keys-desktop">
            <kbd>W</kbd>
            <kbd>A</kbd>
            <kbd>S</kbd>
            <kbd>D</kbd>
            move ·
            <kbd>Shift</kbd>
            crouch ·
            <kbd>Ctrl</kbd>
            sprint ·
            <kbd>F</kbd>
            flip · click to look ·
            <kbd>Esc</kbd>
            release
          </p>
          <p class="hud-keys hud-keys-touch">left drag move · right drag look · tap grab</p>
          <a
            class="hud-watch"
            href="/watch/#movies"
            data-event="blockbuster_browse_watch"
            data-event-category="entertainment"
            data-event-label="hud"
          >
            Browse in Watch →
          </a>
        </footer>
      </div>

      <div id="touch-ui" class="touch-ui" aria-hidden="true">
        <button id="touch-rent" class="touch-rent" type="button" hidden>Rent</button>
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
