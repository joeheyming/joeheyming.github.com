<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simpleton TV → Watch</title>

    <meta
      name="description"
      content="Simpleton TV has moved to /watch/?show=simpsons — part of a multi-show smart-TV channel guide for classic TV from the Internet Archive."
    />

    <!-- noindex: this URL is a redirect stub; the indexable canonical
         page is /watch/?show=simpsons. Keeps it out of the sitemap and
         signals to Google that the old simpletons URL has merged into
         the new multi-show /watch/ app. -->
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://joeheyming.github.io/watch/?show=simpsons" />

    <meta http-equiv="refresh" content="0; url=/watch/?show=simpsons" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b10;
        color: #f5f5f7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      a {
        color: #ffb800;
      }
    </style>
  </head>

  <body>
    <p>
      Simpleton TV has moved to
      <a id="watch-link" href="/watch/?show=simpsons">/watch/?show=simpsons</a>
      . Redirecting…
    </p>

    <script>
      // Forward `?s=X&e=Y` deep links from the old simpletons URL to the new
      // one. The `<meta http-equiv="refresh">` doesn't preserve the query
      // string, so we replace location ourselves before it fires.
      (function () {
        var params = new URLSearchParams(window.location.search);
        params.set('show', 'simpsons');
        var target = '/watch/?' + params.toString();
        document.getElementById('watch-link').href = target;
        // Use replace so the back button skips this stub.
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
