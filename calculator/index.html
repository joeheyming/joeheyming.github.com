  <body class="calc-page--standard">
    <h1 class="page-title">Calculator</h1>
    <div style="position: fixed; bottom: 20px; right: 20px; z-index: 100">
      <share-button label="📤 Share" theme="gradient"></share-button>
    </div>

    <div id="calc-app" class="calc-app calc-app--standard">
      <nav class="calc-mode-nav" aria-label="Calculator mode">
        <button
          type="button"
          class="calc-mode-tab calc-mode-tab--active"
          data-mode="standard"
          aria-selected="true"
        >
          Standard
        </button>
        <button type="button" class="calc-mode-tab" data-mode="graph" aria-selected="false">
          Graph
        </button>
      </nav>

      <div id="calc-panel-standard" class="calc-panel calc-panel--standard">
        <div class="calculator-display" id="calc-display">0</div>
        <div class="calculator-buttons">
          <button type="button" class="calculator-button" data-calc="clear">C</button>
          <button type="button" class="calculator-button" data-calc="sign">±</button>
          <button type="button" class="calculator-button" data-calc="percent">%</button>
          <button type="button" class="calculator-button operator" data-calc="/">÷</button>
          <button type="button" class="calculator-button" data-calc="7">7</button>
          <button type="button" class="calculator-button" data-calc="8">8</button>
          <button type="button" class="calculator-button" data-calc="9">9</button>
          <button type="button" class="calculator-button operator" data-calc="*">×</button>
          <button type="button" class="calculator-button" data-calc="4">4</button>
          <button type="button" class="calculator-button" data-calc="5">5</button>
          <button type="button" class="calculator-button" data-calc="6">6</button>
          <button type="button" class="calculator-button operator" data-calc="-">-</button>
          <button type="button" class="calculator-button" data-calc="1">1</button>
          <button type="button" class="calculator-button" data-calc="2">2</button>
          <button type="button" class="calculator-button" data-calc="3">3</button>
          <button type="button" class="calculator-button operator" data-calc="+">+</button>
          <button type="button" class="calculator-button" data-calc="0" style="grid-column: span 2">
            0
          </button>
          <button type="button" class="calculator-button" data-calc=".">.</button>
          <button type="button" class="calculator-button equals" data-calc="=">=</button>
        </div>
      </div>

      <div id="calc-panel-graph" class="calc-panel calc-panel--graph" hidden>
        <div class="graph-expr-row">
          <label class="graph-expr-label" for="graph-expr-f">
            <span class="graph-swatch" style="background: #38bdf8"></span>
            f(x)
          </label>
          <div class="graph-expr-field graph-expr-field--has-value">
            <input
              id="graph-expr-f"
              class="graph-expr-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              aria-label="f of x"
            />
            <button
              type="button"
              class="graph-expr-clear"
              data-for="graph-expr-f"
              aria-label="Clear f(x)"
              title="Clear"
            >
              ×
            </button>
          </div>
        </div>
        <div class="graph-expr-row">
          <label class="graph-expr-label" for="graph-expr-g">
            <span class="graph-swatch" style="background: #fb923c"></span>
            g(x)
          </label>
          <div class="graph-expr-field graph-expr-field--has-value">
            <input
              id="graph-expr-g"
              class="graph-expr-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              aria-label="g of x"
            />
            <button
              type="button"
              class="graph-expr-clear"
              data-for="graph-expr-g"
              aria-label="Clear g(x)"
              title="Clear"
            >
              ×
            </button>
          </div>
        </div>
        <p id="graph-error" class="graph-error" hidden></p>
        <div class="graph-toolbar">
          <div class="graph-presets" role="group" aria-label="Example functions">
            <button type="button" class="graph-preset" data-target="f" data-expr="sin(x)">
              sin(x)
            </button>
            <button type="button" class="graph-preset" data-target="f" data-expr="cos(x)">
              cos(x)
            </button>
            <button type="button" class="graph-preset" data-target="f" data-expr="x^2">x²</button>
            <button type="button" class="graph-preset" data-target="f" data-expr="x^3 - 3*x">
              x³−3x
            </button>
            <button type="button" class="graph-preset" data-target="f" data-expr="1/x">1/x</button>
            <button type="button" class="graph-preset" data-target="f" data-expr="sqrt(abs(x))">
              √|x|
            </button>
          </div>
          <div class="graph-view-controls">
            <label class="graph-range">
              x min
              <input id="graph-x-min" type="number" step="any" value="-10" />
            </label>
            <label class="graph-range">
              x max
              <input id="graph-x-max" type="number" step="any" value="10" />
            </label>
            <label class="graph-range">
              y min
              <input id="graph-y-min" type="number" step="any" value="-10" />
            </label>
            <label class="graph-range">
              y max
              <input id="graph-y-max" type="number" step="any" value="10" />
            </label>
            <button type="button" class="graph-btn" id="graph-fit-y">Fit Y</button>
            <button type="button" class="graph-btn" id="graph-reset-view">Reset view</button>
          </div>
        </div>
        <div class="graph-canvas-wrap">
          <canvas
            id="graph-canvas"
            class="graph-canvas"
            role="img"
            aria-label="Function plot"
          ></canvas>
          <div id="graph-tooltip" class="graph-tooltip" hidden aria-live="polite"></div>
        </div>
        <p class="graph-hint">Drag to pan · scroll to zoom · hover to see f(x) and g(x)</p>
      </div>
    </div>
  </body>
