    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "VideoGame",
            "name": "Untangle",

              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "gamePlatform": "Web Browser",
            "genre": "Puzzle",
            "keywords": "untangle, planarity, graph puzzle, planar graph",
            "inLanguage": "en"
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Joe Heyming",
                "item": "https://joeheyming.github.io/"
              },
              { "@type": "ListItem", "position": 2, "name": "Untangle" }

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="brand">
          <h1>Untangle</h1>
          <p class="tagline">Drag nodes until no lines cross</p>
        </div>
        <div class="stats" aria-live="polite">
          <div class="stat">
            <span class="stat-label">Level</span>
            <span class="stat-value" id="level">1</span>
          </div>
          <div class="stat">
            <span class="stat-label">Crossings</span>
            <span class="stat-value" id="crossings">—</span>
          </div>
          <div class="stat">
            <span class="stat-label">Moves</span>
            <span class="stat-value" id="moves">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="best">1</span>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="btn-scramble" title="Rescramble this level">
            Scramble
          </button>
          <button type="button" class="btn" id="btn-restart" title="New graph, same level">
            Restart
          </button>
          <button
            type="button"
            class="btn btn-primary"
            id="btn-next"
            disabled
            title="Clear crossings first"
          >
            Next
          </button>
        </div>
      </header>

      <div class="stage-wrap">
        <canvas id="stage" aria-label="Untangle puzzle canvas"></canvas>
        <div class="win-banner" id="win-banner" hidden>
          <strong>Untangled!</strong>
          <div class="win-grade" id="win-grade" aria-live="polite">
            <span class="win-grade-letter" id="win-grade-letter">A</span>
            <span class="win-grade-detail" id="win-grade-detail"></span>
          </div>
        </div>
      </div>
    </div>

    <script src="/achievements.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
