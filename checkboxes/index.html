<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkboxes ☑️ - Joe Heyming</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☑️</text></svg>"
    />
    <link rel="stylesheet" href="index.css" />
    <script src="/back.js"></script>
    <script src="/feedback.js"></script>
    <script src="/share.js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="A shared grid of one million checkboxes — click any box and everyone else's page sees the change. No accounts, no install. Backed by a Google Form (writes) and Sheet (reads) instead of a server."
    />
    <meta name="author" content="Joe Heyming" />
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="checkboxes, shared, multiplayer, one million checkboxes, omcb, google form, google sheet, static site"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming" />
    <meta property="og:title" content="Checkboxes ☑️ - Joe Heyming" />
    <meta
      property="og:description"
      content="A shared grid of one million checkboxes — click any box and everyone else's page sees the change. No accounts, no install."
    />
    <meta property="og:url" content="https://joeheyming.github.io/checkboxes/" />
    <meta
      property="og:image"
      content="https://joeheyming.github.io/checkboxes/checkboxes-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A grid of shared checkboxes, some checked, some not" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@joeheyming" />
    <meta name="twitter:creator" content="@joeheyming" />
    <meta name="twitter:title" content="Checkboxes ☑️" />
    <meta
      name="twitter:description"
      content="A small shared grid of checkboxes — click a box and everyone else's page sees it flip."
    />
    <meta
      name="twitter:image"
      content="https://joeheyming.github.io/checkboxes/checkboxes-preview.png"
    />

    <link rel="canonical" href="https://joeheyming.github.io/checkboxes/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Checkboxes",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "Web Browser",
            "description": "A shared grid of one million checkboxes. Clicks propagate to all viewers via a Google Form + Sheet — no backend.",
            "url": "https://joeheyming.github.io/checkboxes/",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Joe Heyming",
                "item": "https://joeheyming.github.io/"
              },
              { "@type": "ListItem", "position": 2, "name": "Checkboxes" }
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
    <meta name="theme-color" content="#FAFAFA" />
  </head>
  <body>
    <main class="cb-wrapper">
      <header class="cb-header">
        <h1 id="cb-title">Checkboxes</h1>
        <p class="cb-counter" aria-live="polite">
          <strong><span id="cb-checked">0</span></strong>
          /
          <span id="cb-total">…</span>
          boxes are ✅
        </p>
      </header>

      <div id="cb-banner" class="cb-banner" hidden>
        <strong>Demo mode.</strong>
        <span>
          Clicks are local-only. Wire up a Google Form in
          <code>config.js</code>
          to make it shared.
        </span>
      </div>

      <section id="cb-grid" class="cb-grid" role="group" aria-label="Shared checkboxes"></section>

      <footer class="cb-footer" aria-live="polite">
        <span id="cb-status">connecting…</span>
      </footer>
    </main>

    <!-- Achievement modal. Auto-shown by index.js the moment the live
         count of checked cells crosses to N (i.e. every box is checked).
         Closes on ESC, the close button, or backdrop click. -->
    <dialog id="cb-meme" class="cb-meme" aria-labelledby="cb-meme-title">
      <h2 id="cb-meme-title" class="visually-hidden">One Million Checkboxes!</h2>
      <img
        src="dr-evil-million.png"
        alt="Dr. Evil saying 'One million checkboxes' — every box on the page has been checked."
      />
      <p class="cb-meme-caption">Every. Single. Box. You did the impossible. 🎉</p>
      <button id="cb-meme-close" type="button" class="cb-meme-close">Close</button>
    </dialog>

    <script type="module" src="index.js"></script>
  </body>
</html>
