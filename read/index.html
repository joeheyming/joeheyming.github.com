    />

    <title>Books — Free Public-Domain E-Books 📚</title>

    <meta charset="utf-8" />
    <meta

      content="Read thousands of free public-domain books from Project Gutenberg. Adjustable font, themes, and reading position saved automatically."

    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Books — Free Public-Domain E-Books 📚" />
    <meta
      property="og:description"
      content="Read thousands of free classics from Project Gutenberg. Dark, sepia, and light themes. Your reading position is saved automatically."
    />
    <meta property="og:url" content="https://joeheyming.github.io/read/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Books — Free Public-Domain E-Books 📚" />
    <meta name="twitter:image" content="https://joeheyming.github.io/read/read-preview.png" />
    <meta
      name="twitter:image:alt"
      content="Public-domain e-book reader showing a Project Gutenberg classic with a clean, page-like reading layout and themeable typography."
    />

    <link rel="canonical" href="https://joeheyming.github.io/read/" />
    <link rel="manifest" href="/manifest.json" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Books (Read)",
            "alternateName": [
              "Read",
              "Free Project Gutenberg reader",
              "Public domain ebook reader",
              "Browser ebook reader",
              "Free classics reader"
            ],
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web Browser",
            "url": "https://joeheyming.github.io/read/",
            "description": "Browse and read free public-domain books from Project Gutenberg. Adjustable font size, dark / sepia / light themes, and reading position saved automatically per book.",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/about/"
            },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "screenshot": "https://joeheyming.github.io/read/read-preview.png",
            "featureList": [
              "Browse and search Project Gutenberg",
              "Adjustable font size and reading width",
              "Dark, sepia, and light themes",
              "Reading position saved automatically",
              "Works offline once a book is loaded"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Where do the books come from?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Project Gutenberg — the oldest and largest digital library of public-domain books. The page browses Gutenberg's catalog and streams the EPUB/HTML text directly."
                }
              },
              {
                "@type": "Question",
                "name": "Are these books really free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Project Gutenberg only hosts books in the public domain in the United States — typically pre-1929 works whose copyright has expired. They're free to read, share, and (in most cases) redistribute."
                }
              },
              {
                "@type": "Question",
                "name": "Is my reading position saved?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The page tracks scroll position per book in localStorage, so coming back later resumes from where you left off."
                }
              },
              {
                "@type": "Question",
                "name": "Can I read offline?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Once a book has been loaded, it lives in the browser cache and can be re-read offline. Browsing or downloading new books needs a connection."
                }
              },
              {
                "@type": "Question",
                "name": "Are there themes?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Three: dark (white text on near-black), sepia (warm easy-on-the-eyes), and light (black on white). Plus adjustable font size and reading-column width."
                }
              }
            ]
          }
        ]
      }
    </script>

    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body class="hos-page">
    <!-- Browse view -->
    <main id="browse-view">
      <div class="page-wrap">
        <header class="app-header">
          <h1>📚 Books</h1>
          <p class="app-subtitle">Free public-domain books from Project Gutenberg</p>
        </header>

        <!-- Search -->
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search by title or author…"
            aria-label="Search books"
          />
          <button class="search-clear" id="search-clear" aria-label="Clear search">✕</button>
        </div>

        <!-- Search results -->
        <section id="search-results-section" class="hidden">
          <p class="section-title">Search results</p>
          <div id="search-results-grid" class="books-grid"></div>
        </section>

        <!-- Recently opened shelf -->
        <section id="shelf-section" class="hidden">
          <p class="section-title">Recently opened</p>
          <div id="shelf-grid" class="books-grid"></div>
        </section>

        <!-- Featured classics -->
        <section>
          <p class="section-title">Popular classics</p>
          <div id="featured-grid" class="books-grid"></div>
        </section>
      </div>
    </main>

    <!-- Reader view (full-screen overlay) -->
    <div id="reader-view" class="hidden">
      <!-- Reading progress indicator (thin top strip) -->
      <div id="reading-progress" aria-hidden="true"></div>

      <!-- Tap zones: left = page back, right = page forward (Kindle-style) -->
      <div class="page-zone" id="zone-prev" aria-label="Previous page" role="button" tabindex="0">
        <span class="page-chevron" aria-hidden="true">‹</span>
      </div>
      <div class="page-zone" id="zone-next" aria-label="Next page" role="button" tabindex="0">
        <span class="page-chevron" aria-hidden="true">›</span>
      </div>

      <!-- Floating settings toolbar (auto-hides; tap top of screen to show) -->
      <div id="reader-controls" role="toolbar" aria-label="Reading settings">
        <span id="reader-title"></span>

        <button
          class="reader-ctrl-btn"
          id="btn-font-dec"
          aria-label="Decrease font size"
          title="Smaller text"
        >
          A−
        </button>

        <button
          class="reader-ctrl-btn"
          id="btn-font-inc"
          aria-label="Increase font size"
          title="Larger text"
        >
          A+
        </button>

        <button
          class="reader-ctrl-btn"
          id="btn-font-family"
          aria-label="Toggle font"
          title="Toggle serif/sans-serif"
        >
          Serif
        </button>

        <button
          class="reader-ctrl-btn"
          id="btn-theme"
          aria-label="Change theme"
          title="Cycle theme"
        >
          🌙 Dark
        </button>
      </div>

      <!-- Scrollable text -->
      <div id="reader-container" role="main" tabindex="0" aria-label="Book content"></div>

      <!-- Always-visible bottom navigation bar -->
      <div id="reader-nav-bar" role="navigation" aria-label="Reader navigation">
        <button class="reader-nav-btn" id="btn-close-reader" aria-label="Back to library">
          ← Library
        </button>

        <span id="reader-progress-pct" class="reader-nav-progress" aria-live="polite"></span>

        <button
          class="reader-nav-btn reader-nav-btn-toc"
          id="btn-toc"
          aria-label="Table of contents"
        >
          ≡ Contents
        </button>
      </div>
    </div>

    <!-- TOC bottom sheet -->
    <div id="toc-sheet-overlay" class="hidden" aria-hidden="true"></div>
    <div
      id="toc-sheet"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Table of contents"
    >
      <div class="toc-sheet-handle" aria-hidden="true"></div>
      <div class="toc-sheet-head">
        <p class="toc-sheet-title" id="toc-sheet-book-title"></p>
        <button id="btn-close-toc" class="toc-sheet-close" aria-label="Close contents">✕</button>
      </div>
      <div id="toc-list" class="toc-sheet-body"></div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-stack" aria-live="polite"></div>
  </body>
</html>
