<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash — moved to the emulator</title>
    <meta
      name="description"
      content="Flash games now live with the other consoles at /emulator/flash/."
    />
    <!--
      /flash/ was folded into the emulator hub. Static site, so this stub
      bounces bookmarks and old links. noindex so search uses the lander.
    -->
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://joeheyming.github.io/emulator/flash/" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"
    />
    <link rel="stylesheet" href="/brand.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface-0);
        color: var(--text-1);
        font-family: var(--font-ui);
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: var(--text-2);
      }
      a {
        color: var(--accent-primary);
      }
      .cta {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--accent-primary);
        color: var(--text-on-accent);
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
      }
    </style>
    <script>
      (function () {
        var inbound = new URLSearchParams(window.location.search);
        var qs = inbound.toString();
        var target = '/emulator/flash/' + (qs ? '?' + qs : '') + (window.location.hash || '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Flash moved</h1>
      <p>
        Flash games now live with the other consoles at
        <a href="/emulator/flash/">/emulator/flash/</a>
        .
      </p>
      <p>Redirecting you now…</p>
      <a class="cta" href="/emulator/flash/">Play Flash games →</a>
    </main>
  </body>
</html>
