  <body class="instrument-body">
    <header class="app-header">
      <nav
        class="app-breadcrumbs"
        aria-label="Breadcrumb"
        data-crumbs='[{"emoji":"🎵","label":"Instruments","href":"../"},{"emoji":"✏️","label":"Wave Draw"}]'
      ></nav>
    </header>
    <header class="instrument-header">
      <div class="instrument-page-title">
        <span aria-hidden="true">✏️</span>
        <h1>Wave Draw</h1>
      </div>
      <div class="header-status">
        <div class="now-playing" id="now-playing" aria-live="polite">—</div>
        <div class="midi-status" id="midi-status" hidden>
          <span class="midi-dot" aria-hidden="true"></span>
          <span class="midi-label">MIDI</span>
        </div>
      </div>
    </header>

    <section class="instrument-controls" aria-label="Wave draw controls">
      <div class="control">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="100" value="60" />
      </div>

      <div class="control octave-control">
        <label>Octave</label>
        <div class="octave-buttons">
          <button id="octave-down" type="button" aria-label="Octave down">−</button>
          <span id="octave-display" class="octave-display" aria-live="polite">C4</span>
          <button id="octave-up" type="button" aria-label="Octave up">+</button>
        </div>
      </div>

      <div class="control toggle-control">
        <label for="sustain">Sustain</label>
        <input id="sustain" type="checkbox" />
        <span class="hint">(space)</span>
      </div>
    </section>

    <section class="wave-stage">
      <div class="wave-canvas-wrap">
        <canvas id="wave-canvas" width="960" height="180" aria-label="Draw a waveform"></canvas>
      </div>
      <div class="wave-presets" aria-label="Waveform presets">
        <button type="button" data-preset="sine">Sine</button>
        <button type="button" data-preset="square">Square</button>
        <button type="button" data-preset="saw">Saw</button>
        <button type="button" data-preset="triangle">Triangle</button>
        <button type="button" data-preset="noise">Noise</button>
        <button type="button" data-preset="clear">Clear</button>
      </div>
      <section class="piano-stage" aria-label="Keyboard">
        <div class="piano-keyboard" id="piano-keyboard"></div>
      </section>
    </section>

    <section class="instrument-help">
      <h2>How to play</h2>
      <ul>
        <li>Draw on the black strip — that shape is one cycle of the oscillator.</li>
        <li>Presets load a sine, square, saw, triangle, noise, or a silent table.</li>
        <li>
          Computer keyboard: lower whites
          <code>Z X C V B N M</code>
          , upper
          <code>Q W E R T Y U</code>
          .
        </li>
      </ul>
    </section>

    <script type="module" src="wave-draw.js"></script>
