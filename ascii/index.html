    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "ASCII Art Converter",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web Browser",
            "description": "Convert images and webcam feed to ASCII art with multiple character sets and color modes.",
            "url": "https://joeheyming.github.io/ascii/",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/"
            },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "Image to ASCII art",
              "Live webcam ASCII",
              "Full color mode",
              "Export PNG and TXT",
              "Multiple character sets"
            ],
            "keywords": "ascii art, webcam, image converter, text art, matrix"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How does ASCII art conversion work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The page samples each pixel of an image (or webcam frame), maps the brightness to a character from a ramp like ' .,:;ox%#@', and renders the result as a monospace text grid. Different ramps give different fidelity — a long ramp captures shading; a short ramp produces a stylised look."
                }
              },
              {
                "@type": "Question",
                "name": "Does the webcam mode upload my video?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Webcam frames are processed entirely in the browser via the MediaDevices API and a 2D canvas. Nothing is uploaded; the camera light goes off the moment you stop recording."
                }
              },
              {
                "@type": "Question",
                "name": "What can I export?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Plain text (.txt) for the raw ASCII grid, and PNG for a styled image of the rendered art (with the chosen font, colour mode, and background). Both export buttons are in the top toolbar."
                }
              },
              {
                "@type": "Question",
                "name": "Is colour ASCII a thing?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — the page supports a full-colour mode that picks the character based on brightness but tints it with the original pixel's colour. Looks great as a PNG export, less terminal-friendly when copy-pasted as text."
                }
              },
              {
                "@type": "Question",
                "name": "Can I drop an image onto the page?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Drag-and-drop from your desktop or paste from the clipboard works. The picker also accepts the standard file types: JPG, PNG, GIF, and WebP."
                }
              }
            ]
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Joe Heyming",
                "item": "https://joeheyming.github.io/"
              },
              { "@type": "ListItem", "position": 2, "name": "ASCII Art" }
            ]
          }
        ]
      }
    </script>

    <link rel="stylesheet" href="index.css" />

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>

  <body>
    <header class="app-header">
      <h1 class="app-title">🔡 ASCII Art</h1>
      <div class="tabs">
        <button id="tab-image" class="tab-btn active" aria-pressed="true" aria-label="Image mode">
          🖼 Image
        </button>
        <button id="tab-webcam" class="tab-btn" aria-pressed="false" aria-label="Webcam mode">
          📷 Webcam
        </button>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="ascii-canvas" aria-label="ASCII art output"></canvas>
      <video
        id="video-feed"
        playsinline
        muted
        autoplay
        webkit-playsinline
        aria-hidden="true"
      ></video>
      <div id="tom-pip" aria-label="Take On Me music video" role="region">
        <div id="tom-pip-label">
          <span>a-ha — Take On Me</span>
          <a
            id="tom-yt-link"
            href="https://www.youtube.com/watch?v=djV11Xbc914"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Take On Me on YouTube in a new tab"
          >
            YouTube ↗
          </a>
        </div>
        <div id="tom-iframe-slot"></div>
      </div>
      <button id="btn-fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
      <div id="overlay-msg" aria-live="polite"></div>
    </div>

    <div class="controls-panel" role="region" aria-label="ASCII art controls">
      <div id="webcam-controls" class="webcam-ctrl-row" style="display: none">
        <button id="btn-start-cam" class="btn btn-primary" aria-label="Start camera">
          📷 Start Camera
        </button>
        <button
          id="btn-stop-cam"
          class="btn btn-danger"
          aria-label="Stop camera"
          style="display: none"
        >
          ⏹ Stop
        </button>
        <button id="btn-snapshot" class="btn" aria-label="Snapshot" style="display: none">
          📷 Snapshot
        </button>
        <button id="btn-flip-cam" class="btn" aria-label="Switch camera" style="display: none">
          🔄 Flip
        </button>
        <button
          id="btn-tom"
          class="btn btn-tom"
          aria-pressed="false"
          aria-label="Toggle Take On Me mode"
          style="display: none"
        >
          🎵 Take On Me
        </button>
        <div
          id="cam-error"
          class="cam-error"
          style="display: none"
          role="alert"
          aria-live="assertive"
        ></div>
      </div>

      <div class="ctrl-row">
        <div class="ctrl-group">
          <label class="ctrl-label" for="ctrl-charset">Charset</label>
          <select id="ctrl-charset" aria-label="Character set">
            <option value="classic">Classic</option>
            <option value="dense">Dense</option>
            <option value="block">Block</option>
            <option value="braille">Braille</option>
            <option value="custom">Custom…</option>
          </select>
        </div>

        <div id="ctrl-custom-wrap" class="ctrl-group" style="display: none">
          <label class="ctrl-label" for="ctrl-custom">Chars</label>
          <input
            type="text"
            id="ctrl-custom"
            aria-label="Custom character set"
            placeholder="@#:. "
            maxlength="128"
          />
        </div>

        <div class="ctrl-group">
          <label class="ctrl-label" for="ctrl-color">Color</label>
          <select id="ctrl-color" aria-label="Color mode">
            <option value="mono">Monochrome</option>
            <option value="green">Green Matrix</option>
            <option value="amber">Amber Terminal</option>
            <option value="color">Full Color</option>
            <option value="predator">Predator 🎯</option>
            <option value="inverted">Inverted</option>
          </select>
        </div>

        <div class="ctrl-group">
          <label class="ctrl-label" for="ctrl-cols">Columns</label>
          <input
            type="range"
            id="ctrl-cols"
            min="20"
            max="200"
            value="80"
            aria-label="Column count (20–200)"
            style="width: 100px"
          />
          <span class="ctrl-val" id="ctrl-cols-val" aria-live="polite">80</span>
        </div>

        <div class="ctrl-group">
          <label class="ctrl-label" for="ctrl-font">Font</label>
          <input
            type="range"
            id="ctrl-font"
            min="6"
            max="18"
            value="10"
            aria-label="Font size (6–18px)"
            style="width: 72px"
          />
          <span class="ctrl-val" id="ctrl-font-val" aria-live="polite">10</span>
        </div>

        <div class="ctrl-group">
          <label class="ctrl-label" for="ctrl-contrast">Contrast</label>
          <input
            type="range"
            id="ctrl-contrast"
            min="0.1"
            max="3"
            step="0.1"
            value="1"
            aria-label="Contrast (0.1–3.0)"
            style="width: 80px"
          />
          <span class="ctrl-val" id="ctrl-contrast-val" aria-live="polite">1.0</span>
        </div>

        <div class="ctrl-group">
          <label class="ctrl-label" for="ctrl-bright">Bright</label>
          <input
            type="range"
            id="ctrl-bright"
            min="-100"
            max="100"
            value="0"
            aria-label="Brightness (−100 to 100)"
            style="width: 80px"
          />
          <span class="ctrl-val" id="ctrl-bright-val" aria-live="polite">0</span>
        </div>
      </div>

      <div class="export-row">
        <span class="export-label">Export</span>
        <button id="btn-copy" class="btn" aria-label="Copy ASCII text to clipboard">
          📋 Copy Text
        </button>
        <button id="btn-png" class="btn" aria-label="Download as PNG image">🖼 PNG</button>
        <button id="btn-txt" class="btn" aria-label="Download as text file">📄 TXT</button>
        <button id="btn-post" class="btn" aria-label="Make a post">📝 Make a Post</button>
      </div>
    </div>

    <input
      type="file"
      id="file-input"
      accept="image/*"
      style="display: none"
      aria-hidden="true"
      tabindex="-1"
    />

    <script src="/achievements.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
