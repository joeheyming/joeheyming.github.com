<?xml version="1.0" encoding="UTF-8"?>
<!--
  Heyming OS — wordmark.

  Two variants live in this single SVG via <symbol>:
    #wordmark-horizontal — "heyming " os" on one line. Default render.
    #wordmark-stacked    — "heyming" / "OS 1.0" two-line lockup. For
                           tall layouts (setup wizard, About-OS modal).

  Usage (horizontal, default):
    <img src="/brand/heyming-os-wordmark.svg" alt="Heyming OS" class="wordmark" />

  Usage (stacked):
    <svg class="wordmark wordmark-lg" viewBox="0 0 240 144" aria-label="Heyming OS 1.0">
      <use href="/brand/heyming-os-wordmark.svg#wordmark-stacked" />
    </svg>

  Coloring:
    - Text fill is hardcoded to brand text-1 white (#F5F5F7). We used
      to use currentColor and rely on the host page's color for theming,
      but this wordmark is used everywhere as an img src and
      currentColor inside an img-loaded SVG resolves to BLACK (the UA
      default; an img cannot inherit color from the host). For the rare
      inline-SVG case (svg/use href), a page can still override via the
      .wm-text-themed class below.
    - The accent dot is hardcoded violet (#7C5CFF) because the dot IS
      the brand signature, and must stay violet on every surface to
      preserve recognition.

  Font behavior:
    - Renders in Inter Display when the page loads Inter; otherwise
      falls back to the platform display sans (SF on Apple, Segoe UI
      on Windows, Roboto on Android). The mark stays recognizable
      across fallbacks because the layout, weight, tracking, and the
      violet dot do the heavy lifting.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" role="img" aria-label="Heyming OS">
  <defs>
    <style><![CDATA[
      .wm-text {
        font-family: 'Inter Display', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: -0.025em;
        fill: #F5F5F7;
        font-variation-settings: 'opsz' 32;
      }
      .wm-text-stacked-version {
        font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        font-weight: 500;
        letter-spacing: 0;
        fill: #F5F5F7;
      }
      /* Opt-in escape hatch for inline-SVG hosts only — does not apply
         when the wordmark is loaded via <img src=...>, because
         currentColor inside an img-loaded SVG resolves to UA black. */
      .wm-text-themed { fill: currentColor; }
    ]]></style>

    <symbol id="wordmark-horizontal" viewBox="0 0 360 64">
      <text class="wm-text" x="0" y="48" font-size="48">heyming</text>
      <circle cx="208" cy="30" r="6" fill="#7C5CFF" />
      <text class="wm-text" x="228" y="48" font-size="48">os</text>
    </symbol>

    <symbol id="wordmark-stacked" viewBox="0 0 240 144">
      <text class="wm-text" x="0" y="56" font-size="56">heyming</text>
      <text class="wm-text" x="0" y="120" font-size="48" letter-spacing="0">OS</text>
      <circle cx="92" cy="104" r="5" fill="#7C5CFF" />
      <text class="wm-text-stacked-version" x="108" y="120" font-size="18">1.0</text>
    </symbol>
  </defs>

  <!-- Default render when this file is loaded directly as an <img> src. -->
  <use href="#wordmark-horizontal" />
</svg>
