<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legend of DOOM — moved to /doom/?flavor=legend | Joe Heyming</title>

    <!--
      /legend-of-doom/ was folded into /doom/ in commit e4621fa (May 2026).
      The unified runner uses ?flavor=legend to auto-prime Freedoom + the
      Legend of DOOM PK3 mod. This page exists so any inbound link, search
      result, or bookmark to the old URL still works.

      Static site, no real 301 redirects available. The combo of:
        * <meta http-equiv="refresh" content="0; url=...">
        * <link rel="canonical" href="...">
        * JS that preserves any query string / fragment
        * <meta name="robots" content="noindex,follow">
      is what Google et al treat as equivalent to a 301: the search signal
      consolidates onto /doom/?flavor=legend, the old URL drops out of the
      index, and any UTM params / fragments survive the bounce.
    -->
    <meta name="robots" content="noindex,follow" />
    <meta http-equiv="refresh" content="0; url=/doom/?flavor=legend" />
    <link rel="canonical" href="https://joeheyming.github.io/doom/?flavor=legend" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗡️</text></svg>"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: #cbd5e1;
      }
      a {
        color: #93c5fd;
      }
      a:hover {
        color: #bfdbfe;
      }
      .cta {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        color: #fff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
      }
    </style>

    <script>
      // Preserve any inbound query string / fragment, but make sure the
      // flavor=legend hint reaches /doom/. If the visitor originally had
      // ?manual=1 (they wanted the upload UI), keep that and drop the
      // flavor hint so the picker doesn't fight the manual loader.
      (function () {
        var inbound = new URLSearchParams(window.location.search);
        var manual = inbound.get('manual') === '1';
        if (!manual) inbound.set('flavor', 'legend');
        var qs = inbound.toString();
        var target = '/doom/' + (qs ? '?' + qs : '') + (window.location.hash || '');
        // replace() (not assign) so the back button skips this stub.
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Legend of DOOM moved</h1>
      <p>
        This page now lives at
        <a href="/doom/?flavor=legend">/doom/?flavor=legend</a> as one of the flavors in the
        unified DOOM runner.
      </p>
      <p>Redirecting you now…</p>
      <a class="cta" href="/doom/?flavor=legend">Play Legend of DOOM →</a>
    </main>
  </body>
</html>
