  <body>
    <div id="terminal-share-dock">
      <share-button label="📤 Share" theme="retro"></share-button>
    </div>
    <main id="terminal-container" aria-label="jsh terminal">
      <a class="terminal-skip-link" href="#terminal-input">Skip to command line</a>
      <!-- Scroll output + prompt together so the input sits under the last line (classic terminal). -->
      <div id="terminal-scroll" class="terminal-scroll" aria-label="Terminal session">
        <div id="terminal-output" role="region" aria-label="Command output"></div>
        <div id="current-prompt-line" role="group" aria-label="Current prompt">
          <span id="prompt-text"></span>
          <input
            type="text"
            id="terminal-input"
            aria-labelledby="prompt-text"
            autofocus
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="Type a command..."
          />
        </div>
      </div>
      <button
        type="button"
        id="terminal-scroll-latest"
        class="terminal-scroll-latest"
        hidden
        aria-label="Jump to latest output"
      >
        ↓ Latest
      </button>
      <div
        id="terminal-session-hints"
        class="terminal-session-hints"
        role="region"
        aria-label="Keyboard shortcuts"
      >
        <div class="terminal-session-hints-inner">
          <span class="terminal-hint-group">
            <kbd>↑</kbd>
            <kbd>↓</kbd>
            <span class="terminal-hint-label">history</span>
          </span>
          <span class="terminal-hint-sep" aria-hidden="true">·</span>
          <span class="terminal-hint-group">
            <kbd>Tab</kbd>
            <span class="terminal-hint-label">complete</span>
          </span>
          <span class="terminal-hint-sep" aria-hidden="true">·</span>
          <span class="terminal-hint-group">
            <kbd>Ctrl</kbd>
            <span class="terminal-hint-plus" aria-hidden="true">+</span>
            <kbd>C</kbd>
            <span class="terminal-hint-label">interrupt</span>
          </span>
        </div>
      </div>
    </main>
    <script>
      if (window.parent !== window) {
        document.documentElement.classList.add('terminal-embed-os');
        const tc = document.getElementById('terminal-container');
        const ts = document.getElementById('terminal-scroll');
        if (tc) tc.setAttribute('aria-label', 'jsh terminal (Heyming OS window)');
        if (ts) ts.setAttribute('aria-label', 'Terminal session in this window');
      }
    </script>
    <script src="/proxy.js"></script>

    <!-- OS Filesystem (shared with File Manager — stays classic for iframe compat) -->
    <script src="../os/filesystem-db.js"></script>
    <!-- Single module entry point: imports core stack, registry, terminal, then boots OS -->
    <script type="module" src="main.js"></script>
