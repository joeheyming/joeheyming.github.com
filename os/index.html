<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <base href="../" />
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Heyming OS | Joe Heyming</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Heyming OS - A browser-based desktop environment with apps, filesystem, and window management."
    />
    <meta name="author" content="Joe Heyming" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1e3a5f" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Heyming" />
    <meta property="og:title" content="Heyming OS" />
    <meta
      property="og:description"
      content="A browser-based desktop environment with apps, filesystem, and window management."
    />
    <meta property="og:url" content="https://joeheyming.github.io/os/" />
    <meta
      property="og:image"
      content="https://joeheyming.github.io/os/os-preview.png"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
    <!-- FileSystemDB loaded as regular script (shared with iframes) -->
    <script src="os/filesystem-db.js"></script>
    <!-- OS modules (ES Module entry point) -->
    <script type="module" src="os/index.js"></script>
    <link rel="stylesheet" href="os.css" />

    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body class="h-full bg-gray-900">
    <!-- Heyming OS (visible by default on dedicated page) -->
    <div id="heyming-os" class="fixed inset-0 bg-gray-900 z-[200]">
      <!-- Desktop Background -->
      <div
        id="os-desktop"
        class="w-full h-full bg-gradient-to-br from-blue-900 to-purple-900 relative overflow-hidden"
      >
        <!-- Taskbar -->
        <div
          id="os-taskbar"
          class="absolute bottom-0 left-0 right-0 h-12 bg-gray-800 border-t border-gray-600 flex items-center px-2"
        >
          <!-- Application Launcher -->
          <button
            id="app-launcher"
            class="h-8 px-3 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded transition-colors duration-200 mr-2"
          >
            🚀 Apps
          </button>

          <!-- Running Apps Area -->
          <div id="running-apps" class="flex space-x-1 flex-1"></div>

          <!-- Clock -->
          <div
            id="taskbar-clock"
            class="text-white text-sm font-mono px-3 cursor-default select-none"
          ></div>

          <!-- System Info -->
          <div id="system-info" class="text-green-400 text-sm font-mono">Heyming OS v1.0</div>

          <!-- Shutdown Button -->
          <button
            id="os-close"
            class="ml-2 h-8 px-3 bg-gray-700 hover:bg-red-600 text-white text-sm rounded transition-colors duration-200 shutdown-btn"
            title="Shutdown Heyming OS"
          >
            ⏻
          </button>
        </div>

        <!-- App Launcher Menu -->
        <div
          id="app-launcher-menu"
          class="absolute bottom-12 left-2 w-64 bg-gray-800 border border-gray-600 rounded-t-lg shadow-2xl hidden"
        >
          <div class="p-4">
            <h3 class="text-white font-bold mb-3">Applications</h3>
            <!-- Filter Input -->
            <div class="relative mb-3">
              <input
                type="text"
                id="launcher-filter"
                placeholder="Search apps..."
                class="w-full px-3 py-2 pl-8 bg-gray-700 text-white rounded border border-gray-600 focus:outline-none focus:border-blue-500 text-sm"
              />
              <span
                class="absolute left-2.5 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"
              >
                🔍
              </span>
            </div>
            <div id="launcher-apps-container" class="space-y-2"></div>
            <div id="launcher-no-results" class="hidden text-gray-400 text-sm text-center py-4">
              No matching apps
            </div>
          </div>
        </div>

        <!-- Windows Container -->
        <div id="os-windows" class="absolute inset-0 bottom-12"></div>

        <!-- Shutdown Confirmation Dialog -->
        <div
          id="shutdown-dialog"
          class="fixed inset-0 bg-black bg-opacity-50 hidden z-[300] flex items-center justify-center"
        >
          <div
            class="bg-gray-800 border border-gray-600 rounded-lg p-6 max-w-sm w-full mx-4 shadow-2xl"
          >
            <div class="flex items-center mb-4">
              <div class="text-3xl mr-3">⏻</div>
              <h3 class="text-white text-lg font-semibold">Shutdown Heyming OS</h3>
            </div>
            <p class="text-gray-300 mb-6">
              Are you sure you want to shut down the operating system?
            </p>
            <div class="flex space-x-3 justify-end">
              <button
                id="shutdown-cancel"
                class="px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded transition-colors duration-200"
              >
                Cancel
              </button>
              <button
                id="shutdown-confirm"
                class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded transition-colors duration-200"
              >
                Shutdown
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      function autoShowOS() {
        if (window.heymingOS) {
          window.heymingOS.show();
        } else {
          setTimeout(autoShowOS, 100);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', autoShowOS);
      } else {
        autoShowOS();
      }
    </script>
  </body>
</html>
