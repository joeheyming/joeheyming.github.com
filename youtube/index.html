                "acceptedAnswer": {

                }

                "acceptedAnswer": {

  <body>
    <div class="crt-room">
      <!-- Brand strip above the TV -->
      <h1 class="crt-brand">
        <span class="pwr-dot" aria-hidden="true"></span>
        JoeTube · Channel J
      </h1>

      <!-- The TV itself -->
      <section class="crt-tv" aria-label="JoeTube television">
        <div class="crt-bezel">
          <div class="crt-bezel-label">
            <span>CRT-83 · Cathode Ray</span>
            <span class="crt-channel-chip" id="crt-bezel-channel">CH 00</span>
          </div>

          <!-- The CRT screen -->
          <div class="crt-screen-wrap">
            <div class="crt-screen">
              <div id="carousel-container" class="carousel-container">
                <div id="carousel-track" class="carousel-track">
                  <!-- Slides injected at runtime by modules/carousel.js -->
                </div>
              </div>
            </div>

            <!-- Loading overlay: "TUNING…" with TV static -->
            <div id="crt-static" class="crt-static" aria-hidden="true"></div>
            <div id="crt-loading" class="crt-overlay" role="status" aria-live="polite">
              <p class="crt-overlay-title">⟁ TUNING ⟁</p>
              <p class="crt-overlay-message">Searching channel for signal…</p>
            </div>

            <!-- Error overlay: "NO SIGNAL" -->
            <div id="crt-no-signal" class="crt-overlay hidden" role="alert">
              <p class="crt-overlay-title">⚠ NO SIGNAL</p>
              <p class="crt-overlay-message crt-no-signal-detail">
                Channel J is off the air. Try again later.
              </p>
            </div>
          </div>

          <!-- Channel display + knob row -->
          <div class="crt-controls-row">
            <div class="crt-channel-display" aria-live="polite">
              <span class="label">Channel</span>
              <span class="value" id="crt-channel-value">00</span>
              <span class="total" id="crt-channel-total">/ 00</span>
            </div>

            <button
              id="crt-knob"
              class="crt-knob"
              type="button"
              aria-label="Shuffle to a random channel"
              title="Click to shuffle"
            >
              <span class="crt-knob-cap" aria-hidden="true"></span>
            </button>

            <div class="crt-side-buttons">
              <button id="crt-ch-up" class="crt-btn" type="button" aria-label="Next channel">
                <span class="crt-btn-glyph">▲</span>
                CH+
              </button>
              <button id="crt-ch-down" class="crt-btn" type="button" aria-label="Previous channel">
                <span class="crt-btn-glyph">▼</span>
                CH-
              </button>
            </div>
          </div>
        </div>

        <!-- Front-panel button row -->
        <div class="crt-panel">
          <button id="crt-prev" class="crt-btn" type="button">
            <span class="crt-btn-glyph">◀</span>
            PREV
          </button>
          <button id="crt-shuffle" class="crt-btn is-accent" type="button">⇄ SHUFFLE</button>
          <a id="crt-youtube-link" class="crt-btn" target="_blank" rel="noopener" href="#">
            ⇪ YOUTUBE
          </a>
          <button id="crt-copy-link" class="crt-btn" type="button">⌘ COPY LINK</button>
          <button id="crt-copy-title" class="crt-btn" type="button">✎ COPY TITLE</button>
          <button id="crt-next" class="crt-btn" type="button" style="grid-column: 1 / -1">
            NEXT
            <span class="crt-btn-glyph">▶</span>
          </button>
        </div>
      </section>

      <!-- "NOW PLAYING" marquee under the TV -->
      <div id="crt-marquee" class="crt-marquee" aria-live="polite">
        <span class="crt-now-tag">
          <span class="crt-rec-dot" aria-hidden="true"></span>
          NOW PLAYING
        </span>
        <span id="crt-title" class="crt-title">—</span>
      </div>

      <div class="crt-help">
        <kbd>◀</kbd>
        <kbd>▶</kbd>
        change channel ·
        <kbd>R</kbd>
        shuffle ·
        <kbd>Enter</kbd>
        play
      </div>

      <!-- Site-wide share button (custom element handled by /share.js) -->
      <share-button label="📤 Share" theme="glass"></share-button>
    </div>
  </body>
