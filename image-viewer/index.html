  <head>

      content="View image files in your browser with zoom, pan, rotate, and fullscreen. Supports PNG, JPG, GIF, WebP, SVG, and BMP."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Image Viewer",
            "alternateName": [
              "Browser image viewer",
              "HTML image viewer",
              "Web image viewer",
              "Online image viewer free",
              "Zoom and pan image viewer"
            ],
            "url": "https://joeheyming.github.io/image-viewer/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web Browser",
            "description": "View image files in your browser with zoom, pan, rotate, and fullscreen controls. Supports PNG, JPG, GIF, WebP, SVG, and BMP. Drop a file or click Open. Nothing is uploaded — images are decoded locally.",
            "author": {
              "@type": "Person",
              "name": "Joe Heyming",
              "url": "https://joeheyming.github.io/about/"
            },
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What file types are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "PNG, JPG / JPEG, GIF (including animated), WebP, SVG, BMP, and TIFF. Whatever your browser decodes natively, the viewer can show."
                }
              },
              {
                "@type": "Question",
                "name": "Are my images uploaded?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The image is loaded as a local object URL and rendered in the browser. Nothing is sent to a server; the page works offline once cached."
                }
              },
              {
                "@type": "Question",
                "name": "How do I zoom and pan?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Scroll-wheel or pinch to zoom; click-and-drag (or one-finger drag) to pan. Double-click resets to fit-to-window. Keyboard arrows nudge the view; +/- zoom; R rotates 90 degrees."
                }
              },
              {
                "@type": "Question",
                "name": "Can I view multi-page TIFF or animated GIF?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Animated GIF and WebP play automatically. Multi-page TIFF browser support is limited — the viewer shows the first page on most browsers."
                }
              }
            ]
          }
        ]
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q62Q3E20Y0"></script>
    <script src="/analytics.js"></script>
    <script src="/nav.js" data-nav-size="compact"></script>

    <!-- Heyming OS brand foundation -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body>
    <div id="viewer-container">
      <!-- Toolbar -->
      <div id="toolbar">
        <div class="toolbar-group">
          <button id="btn-open" title="Open Image (Ctrl+O)">📂 Open</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-zoom-out" title="Zoom Out (-)" disabled>➖</button>
          <span id="zoom-level">100%</span>
          <button id="btn-zoom-in" title="Zoom In (+)" disabled>➕</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-fit" title="Fit to Window (F)" disabled>⊡ Fit</button>
          <button id="btn-actual" title="Actual Size (1)" disabled>1:1</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-rotate-left" title="Rotate Left (L)" disabled>↶</button>
          <button id="btn-rotate-right" title="Rotate Right (R)" disabled>↷</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-fullscreen" title="Fullscreen (Enter)" disabled>⛶</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
          <span id="image-info">No image</span>
        </div>
      </div>

      <!-- Drop Zone -->
      <div id="drop-zone" class="active">
        <div class="drop-content">
          <span class="icon">🖼️</span>
          <h1>Image Viewer</h1>
          <p>
            Drop an image here or click
            <strong>Open</strong>
          </p>
          <p class="formats">Supports: PNG, JPG, GIF, WebP, SVG, BMP</p>
          <p class="seo-intro">
            A lightweight image viewer for Heyming OS. Zoom in for detail, rotate photos, fit images
            to the window, or go fullscreen — all without leaving the browser.
          </p>
        </div>
      </div>

      <!-- Image Area -->
      <div id="image-wrapper" class="hidden">
        <div id="image-container">
          <img id="image" draggable="false" alt="" role="presentation" />
        </div>
      </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept="image/*" style="display: none" />

    <script src="image-viewer.js"></script>
  </body>
</html>
