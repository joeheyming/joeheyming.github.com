<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic DOOM — moved to /doom/?flavor=sonic</title>

    <meta
      name="description"
      content="Sonic DOOM lives at /doom/?flavor=sonic — the unified DOOM runner auto-primes Freedoom Phase 2 and Sonic the Hedgehog in DOOM: Legacy Edition."
    />

    <!--
      Same redirect pattern as /legend-of-doom/ → /doom/?flavor=legend:
        * JS location.replace() that preserves query string / fragment
        * <link rel="canonical" href="...">
        * Visible <a> fallback for no-JS / crawlers
        * <meta name="robots" content="noindex,follow">
      (No MetaRefresh — Bing flags those.)
    -->
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://joeheyming.github.io/doom/?flavor=sonic" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💨</text></svg>"
    />

    <link rel="stylesheet" href="/brand.css" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--surface-0);
        color: var(--text-1);
        font-family: var(--font-ui);
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: var(--text-2);
      }
      a {
        color: var(--accent-primary);
      }
      a:hover {
        color: var(--accent-primary-hover);
      }
      .cta {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--accent-primary);
        color: var(--text-on-accent);
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
      }
    </style>

    <script>
      (function () {
        var inbound = new URLSearchParams(window.location.search);
        var manual = inbound.get('manual') === '1';
        if (!manual) inbound.set('flavor', 'sonic');
        var qs = inbound.toString();
        var target = '/doom/' + (qs ? '?' + qs : '') + (window.location.hash || '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Sonic DOOM</h1>
      <p>
        This page lives at
        <a href="/doom/?flavor=sonic">/doom/?flavor=sonic</a>
        as one of the flavors in the unified DOOM runner.
      </p>
      <p>Redirecting you now…</p>
      <a class="cta" href="/doom/?flavor=sonic">Play Sonic DOOM →</a>
    </main>
  </body>
</html>
