    <link rel="stylesheet" href="index.css" />
    <!-- proxy.js must load BEFORE the app module so window.proxyService is
         ready when offline.js / saveEpisode call it. archive.org's CDN
         redirect (dn710203.ca.archive.org) doesn't set CORS headers, so
         the proxy chain is the only way to download MP4 bytes from JS. -->

  <body>
    <!-- Page-level fixed banner. Lives outside .tv-room so the
         translucent bar can span the viewport edge-to-edge while the
         content underneath stays capped at .tv-room's max-width. -->
    <header class="tv-header">
      <nav id="tv-breadcrumbs" class="tv-breadcrumbs" aria-label="Breadcrumb"></nav>
    </header>

    <div class="tv-room">
      <!--
        Visually-hidden page heading. The TV-room UI is a channel grid
        with no visible title strip, but search engines and screen
        readers expect one <h1> per page. Positioned absolute + 1px
        clip is the standard "sr-only" pattern (no Tailwind utility
        is loaded here, so we inline-style it).
      -->
      <h1
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border: 0;
        "
      >
        Watch Classic TV Online — Internet Archive Smart-TV Channel Guide
      </h1>

      <!--
        SEO fallback for crawlers that don't render JS and for users with
        JavaScript disabled. The interactive view (`<main id="tv-view">`)
        below is JS-rendered, so the static body would otherwise contain
        no keyword-bearing content. This block is roster-independent on
        purpose: it describes the experience and category mix, not the
        currently-loaded shows, so the Sheet-backed registry can churn
        without touching SEO copy.
      -->
      <noscript>
        <section class="tv-seo-fallback">
          <h2>Internet Archive Smart-TV Channel Guide</h2>
          <p>
            Watch is a browser-based smart-TV channel guide for classic public-domain television
            hosted on the
            <a href="https://archive.org/">Internet Archive</a>
            . Episodes stream as plain H.264 MP4 directly into an HTML5
            <code>&lt;video&gt;</code>
            element — no signup, no account, no ads, no app install. The page itself is a static
            GitHub Pages deploy; the only "backend" is archive.org's public file endpoints plus
            public TVMaze and OpenSubtitles JSON.
          </p>
          <h3>What's on the channel guide</h3>
          <ul>
            <li>Classic animation and animated TV.</li>
            <li>Public-domain sitcoms and live-action classics.</li>
            <li>Saturday-morning cartoons.</li>
            <li>Standalone classic and public-domain feature films.</li>
          </ul>
          <h3>Features</h3>
          <ul>
            <li>Channel-grid navigation by arrow keys, TV remote / D-pad, or pointer.</li>
            <li>Continue Watching tracks where you left off in each show.</li>
            <li>Save full episodes offline to IndexedDB for later playback without a network.</li>
            <li>Optional CC subtitles via the OpenSubtitles addon, where available.</li>
            <li>
              Cast to a Chromecast or AirPlay-compatible TV through the standard browser video
              controls.
            </li>
          </ul>
          <p>
            This page requires JavaScript.
            <a href="/">← Browse all apps on joeheyming.github.io</a>
          </p>
        </section>
      </noscript>

      <!-- The router mounts the active view here. Views own their own DOM:
           shows-view (grid), episodes-view (season + ep list), watch-view
           (TV chassis + player). Only one is in the DOM at a time. -->
      <main id="tv-view" class="tv-view" aria-live="polite"></main>

      <p class="tv-fineprint">
        Files served directly from the Internet Archive. This site only links — it does not host.
      </p>

      <share-button label="📤 Share" theme="glass"></share-button>
    </div>
  </body>
