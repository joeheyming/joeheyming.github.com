  <body>
    <div class="main-container">
      <!-- Game Area -->
      <div class="game-area">
        <div id="game-container">
          <!-- DOOM game will be inserted here -->
          <div class="start-prompt">Click to start</div>
        </div>
      </div>

      <!-- Share Button -->
      <div style="position: fixed; bottom: 20px; left: 20px; z-index: 100">
        <share-button label="📤 Share" theme="dark"></share-button>
      </div>

      <!-- Controls Sidebar -->
      <aside class="controls-sidebar">
        <div class="controls-card">
          <h2>Controls</h2>
          <div class="controls-list">
            <div class="control-item">
              <span class="key">Arrow Keys</span>
              <span class="action">Move (ASDW) and turn (Arrow Left/Right)</span>
            </div>
            <div class="control-item">
              <span class="key">Q</span>
              <span class="action">Fire weapon</span>
            </div>
            <div class="control-item">
              <span class="key">E</span>
              <span class="action">Open doors / Use switches</span>
            </div>
            <div class="control-item">
              <span class="key">Alt</span>
              <span class="action">Run / Strafe</span>
            </div>
            <div class="control-item">
              <span class="key">Escape</span>
              <span class="action">Menu</span>
            </div>
            <div class="control-item">
              <span class="key">Enter</span>
              <span class="action">Select menu item</span>
            </div>
            <div class="control-item">
              <span class="key">Numbers</span>
              <span class="action">Switch weapons</span>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls">
      <!-- Top row: Action buttons (horizontal) -->
      <div class="mobile-controls-top">
        <div class="action-buttons-horizontal">
          <button class="control-btn action-btn" data-key="e" data-code="KeyE" data-keycode="69">
            🚪
          </button>
          <button
            class="control-btn action-btn enter-btn"
            data-key="Enter"
            data-code="Enter"
            data-keycode="13"
            title="Enter - Select menu item"
          >
            ENTER
          </button>
          <button
            class="control-btn action-btn escape-btn"
            data-key="Escape"
            data-code="Escape"
            data-keycode="27"
            title="Escape - Menu"
          >
            MENU
          </button>
          <button class="control-btn action-btn" data-key="q" data-code="KeyQ" data-keycode="81">
            🔫
          </button>
        </div>
      </div>

      <!-- Bottom row: Movement and Arrow controls -->
      <div class="mobile-controls-bottom">
        <!-- Left side: Movement controls -->
        <div class="mobile-controls-left">
          <!-- Movement pad -->
          <div class="movement-pad">
            <button
              class="control-btn movement-btn"
              data-key="w"
              data-code="KeyW"
              data-keycode="87"
            >
              ↑
            </button>
            <div class="movement-row">
              <button
                class="control-btn movement-btn"
                data-key="a"
                data-code="KeyA"
                data-keycode="65"
              >
                ←
              </button>
              <button
                class="control-btn movement-btn"
                data-key="s"
                data-code="KeyS"
                data-keycode="83"
              >
                ↓
              </button>
              <button
                class="control-btn movement-btn"
                data-key="d"
                data-code="KeyD"
                data-keycode="68"
              >
                →
              </button>
            </div>
          </div>
        </div>

        <!-- Right side: Arrow keys -->
        <div class="mobile-controls-right">
          <div class="arrow-pad">
            <button
              class="control-btn arrow-btn"
              data-key="ArrowUp"
              data-code="ArrowUp"
              data-keycode="38"
            >
              ▲
            </button>
            <div class="arrow-row">
              <button
                class="control-btn arrow-btn"
                data-key="ArrowLeft"
                data-code="ArrowLeft"
                data-keycode="37"
              >
                ◄
              </button>
              <button
                class="control-btn arrow-btn"
                data-key="ArrowDown"
                data-code="ArrowDown"
                data-keycode="40"
              >
                ▼
              </button>
              <button
                class="control-btn arrow-btn"
                data-key="ArrowRight"
                data-code="ArrowRight"
                data-keycode="39"
              >
                ►
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Harden AudioContext.decodeAudioData before the WASM bundle runs so
         decode failures route to the MIDI fallback instead of leaking as
         unhandled promise rejections. Must load before doom.js. -->
    <script src="src/audio-guard.js"></script>

    <!-- Load DOOM WebAssembly module first -->
    <script src="src/doom.js"></script>

    <!-- Load our game modules -->
    <script src="src/index.js"></script>

    <script>
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
        navigator.userAgent
      );

      if (isMobile) {
        document.body.classList.add('mobile-device');
      }
    </script>
